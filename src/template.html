<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#f4f2ed">
<link rel="icon" href="data:,">
<title>AI Usage</title>
<script>
/* Pin the stored scheme before first paint so a pinned theme never flashes. */
{
  var saved = null;
  try { saved = localStorage.getItem("ai-usage-ledger-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") {
    document.querySelector('meta[name="color-scheme"]').content = saved;
    document.documentElement.dataset.cs = saved;
  }
}
</script>
<style>
@layer reset, base, components, chart, utilities;

@layer reset {
  html { box-sizing: border-box; color-scheme: light dark; }
  html[data-cs="light"] { color-scheme: light; }
  html[data-cs="dark"] { color-scheme: dark; }
  body, h1, h2, h3, p, figure { margin: 0; }
  :where(div, section, article, header, footer, aside, main, span, b, i, em, table, thead, tbody, tr, th, td, details, summary, button, svg, p) { box-sizing: border-box; }
  :where(button) { font: inherit; color: inherit; background: none; border: 0; }
  :where(table) { border-collapse: collapse; }
  :where(summary) { list-style: none; }
  :where(summary)::-webkit-details-marker { display: none; }
}

@layer base {
  :root {
    /* ── surfaces: soft cards on a warm canvas ── */
    --canvas:   light-dark(#f4f2ed, #12141a);
    --card:     light-dark(#ffffff, #1a1d26);
    --card-2:   light-dark(#f7f5f0, #222633);
    --ink:      light-dark(#1b1d22, #eef1f6);
    --ink-2:    light-dark(#4d5361, #b3bccd);
    --muted:    light-dark(#78808f, #7f8899);
    --line:     light-dark(#e7e3da, #2b3040);
    --line-2:   light-dark(#d2ccbe, #3a4155);

    /* ── provider identity: reserved, never a series slot ── */
    --claude:   light-dark(#d9581d, #e05e26);
    --codex:    light-dark(#3f6eef, #4575f6);

    /* ── status: reserved for state, never for "series 4" ── */
    --good:     light-dark(#0f8a4d, #2fbd72);
    --warn:     light-dark(#c2760a, #f0a72a);
    --danger:   light-dark(#d0342c, #ff6b5e);

    /* ── categorical theme, fixed order. Validated: adjacent CVD ΔE ≥ 13.7,
          chroma >= .11, inside each mode's lightness band. Slots 1-4 also carry
          the token rail. The single sub-3:1 slot per mode is relieved by the
          labelled legend and the table views, never by hover alone. ── */
    --c1: #2d74e7;  --c2: #bb0570;  --c3: #00ad76;
    --c4: #943de0;  --c5: #009db9;  --c6: #bc6900;
    --c-rest: var(--muted);

    /* ── activity heatmap: single hue, monotone lightness ── */
    --s1: light-dark(#f3b45c, #5c3a12);
    --s2: light-dark(#e79a2e, #86541a);
    --s3: light-dark(#d17f10, #b06f1f);
    --s4: light-dark(#ad6403, #db8b28);
    --s5: light-dark(#874c00, #f7ab45);

    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;

    --r-card: 16px;
    --r-item: 10px;
    --r-pill: 999px;
    --shadow: light-dark(0 1px 2px rgb(30 26 18 / .05), 0 1px 2px rgb(0 0 0 / .3)),
              light-dark(0 10px 26px rgb(30 26 18 / .06), 0 12px 30px rgb(0 0 0 / .32));
  }

  /* The canvas colour lives on `html`, not just `body`: without it the browser
     paints its own white behind the first frame and the loader appears to sit
     on a different shade than the page it hands over to. */
  html { -webkit-text-size-adjust: 100%; background: var(--canvas); }
  body {
    min-block-size: 100dvh;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 0.875rem;
    line-height: 1.55;
    accent-color: var(--claude);
    scrollbar-color: var(--line-2) var(--canvas);
    scrollbar-width: thin;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; font-weight: 700; scroll-margin-block-start: 1rem; }
  #app { scroll-margin-block-start: 1rem; }
  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: color-mix(in oklab, var(--claude) 18%, transparent);
  }
  :where(button, summary, a, [tabindex]):focus-visible {
    outline: 2px solid var(--codex);
    outline-offset: 2px;
    border-radius: var(--r-item);
  }
  @media (forced-colors: active) {
    .card, .tile { border: 1px solid CanvasText; }
    :where(button, summary):focus-visible { outline: 2px solid Highlight; }
  }
  /* pixel numerals sit on the text baseline like a glyph would */
  .pixtype { display: inline-block; vertical-align: baseline; }
}

@layer components {
  .shell { max-inline-size: 84rem; margin-inline: auto; padding: 1.25rem clamp(.75rem, 2.6vw, 1.75rem) 3rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
  }

  /* ── header ── */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
  .brand { display: flex; align-items: center; gap: .7rem; min-inline-size: 0; }
  .brand-badge {
    inline-size: 42px; block-size: 42px; flex: none; display: grid; place-items: center;
    border-radius: 13px; color: #fff;
    background: linear-gradient(135deg in oklab, var(--claude), color-mix(in oklab, var(--claude) 55%, var(--c2)));
    box-shadow: 0 4px 12px color-mix(in oklab, var(--claude) 34%, transparent);
  }
  .brand-badge svg { inline-size: 23px; block-size: 23px; }
  .wordmark { color: var(--ink); line-height: 1; display: block; }
  .brand p { color: var(--muted); font-size: .6875rem; margin-block-start: .3rem; overflow-wrap: anywhere; }
  .topbar-actions { display: flex; align-items: center; gap: .45rem; margin-inline-start: auto; flex-wrap: wrap; }

  .seg { display: flex; gap: 2px; padding: 3px; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-pill); }
  .seg button {
    min-block-size: 30px; padding-inline: .8rem; border-radius: var(--r-pill);
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    color: var(--ink-2); cursor: pointer; font-size: .75rem; white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .seg button:hover:not([aria-pressed="true"]) { color: var(--ink); background: color-mix(in oklab, var(--ink) 7%, transparent); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .iconbtn {
    min-inline-size: 38px; min-block-size: 38px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--card); color: var(--ink-2); cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--line-2); }

  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .9rem;
    margin-block-start: .9rem; padding: .55rem .85rem;
    border-radius: var(--r-pill);
    background: color-mix(in oklab, var(--warn) 12%, var(--card));
    color: var(--ink-2); font-size: .6875rem;
  }
  .notice b { color: light-dark(#8a5406, #f0a72a); }
  .notice .live { display: inline-flex; align-items: center; gap: .4rem; margin-inline-start: auto; white-space: nowrap; }
  .notice .live::before { content: ""; inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--good); }

  /* ── sections ── */
  .section { margin-block-start: 1.5rem; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; margin-block-end: .75rem; }
  .h2 { font-size: 1rem; }
  .cap { color: var(--muted); font-size: .6875rem; }
  .tools { margin-inline-start: auto; display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .total { color: var(--ink-2); font: 600 .75rem/1.4 var(--mono); font-variant-numeric: tabular-nums; }

  .grid-2 { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); }

  /* ── quota card ── */
  .quota { padding: 1rem 1.1rem; display: grid; gap: .85rem; }
  .quota-head { display: flex; align-items: center; gap: .5rem; }
  .quota-head .dot { inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--p); flex: none; }
  .quota-head h3 { font-size: .875rem; }
  .quota-src { margin-inline-start: auto; color: var(--muted); font-size: .625rem; letter-spacing: .06em; text-transform: uppercase; }

  .meter-row { display: grid; gap: .4rem; }
  .meter-top { display: flex; align-items: flex-end; gap: .5rem; flex-wrap: wrap; }
  .meter-label { color: var(--ink-2); font-size: .75rem; font-weight: 600; }
  .meter-pct { color: var(--sev, var(--good)); font: 700 1.35rem/1 var(--mono); font-variant-numeric: tabular-nums; }
  .meter-note { margin-inline-start: auto; color: var(--muted); font-size: .6875rem; white-space: nowrap; }
  .blocks { display: flex; gap: 2px; }
  .blocks i { flex: 1; block-size: 12px; border-radius: 2px; background: var(--off); }
  .meter-foot { display: flex; gap: .5rem; color: var(--muted); font-size: .625rem; }
  .meter-foot :last-child { margin-inline-start: auto; }
  .alarm {
    display: flex; align-items: center; gap: .45rem; padding: .5rem .7rem;
    border-radius: var(--r-item); font-size: .75rem; font-weight: 600;
    background: color-mix(in oklab, var(--danger) 14%, var(--card));
    color: light-dark(#a5251e, #ff8b80);
  }
  .alarm svg { inline-size: 16px; block-size: 16px; flex: none; }
  .stale {
    display: flex; align-items: center; gap: .45rem; padding: .45rem .7rem;
    border-radius: var(--r-item); font-size: .6875rem;
    background: color-mix(in oklab, var(--warn) 15%, var(--card));
    color: light-dark(#8a5406, #f0a72a);
  }
  .stale svg { inline-size: 14px; block-size: 14px; flex: none; }

  /* ── hero ── */
  .hero { margin-block-start: .75rem; padding: 1.15rem 1.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: .9rem 2rem; }
  .hero-label { color: var(--muted); font-size: .6875rem; text-transform: uppercase; letter-spacing: .13em; }
  .hero-figure { display: block; margin-block-start: .5rem; color: var(--claude); }
  .hero-spark { inline-size: clamp(8rem, 20vw, 15rem); block-size: 3rem; }
  .hero-facts { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
  .hero-facts div { display: grid; }
  .hero-facts span { color: var(--muted); font-size: .6875rem; }
  .hero-facts b { color: var(--ink); font: 700 .95rem/1.3 var(--mono); font-variant-numeric: tabular-nums; }

  /* ── provider cards ── */
  .prov { padding: 1rem 1.1rem; --p: var(--claude); display: grid; gap: .7rem; }
  .prov-top { display: flex; align-items: center; gap: .5rem; }
  .prov-name { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; }
  .prov-name .chip { inline-size: 26px; block-size: 26px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--p); flex: none; }
  .prov-name .chip svg { inline-size: 15px; block-size: 15px; }
  .prov-share { margin-inline-start: auto; padding: .1rem .5rem; border-radius: var(--r-pill); background: color-mix(in oklab, var(--p) 14%, transparent); color: var(--p); font-size: .6875rem; font-weight: 600; }
  .prov-cost { color: var(--p); }
  .prov-cost + span { color: var(--muted); font-size: .6875rem; }
  .prov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .prov-stats span { display: block; color: var(--muted); font-size: .6875rem; }
  .prov-stats b { display: block; font: 700 .875rem/1.4 var(--mono); font-variant-numeric: tabular-nums; }
  .rail { block-size: 10px; display: flex; gap: 2px; }
  .rail i { display: block; min-inline-size: 0; border-radius: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: .2rem .85rem; color: var(--muted); font-size: .6875rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { inline-size: 9px; block-size: 9px; border-radius: 3px; flex: none; }
  .legend b { color: var(--ink-2); font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Both panes share one alignment: chart centred, caption centred directly
     under it. Previously the heatmap was centred while its legend hugged the
     card's left edge, which read as a misalignment rather than a choice. */
  .activity-split { display: grid; gap: 1.25rem 1.5rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); align-items: start; }
  .activity-pane { margin: 0; display: grid; justify-items: center; gap: .6rem; }
  .activity-pane .chart-box { max-inline-size: 22rem; }
  .activity-pane figcaption { justify-content: center; text-align: center; }

  /* ── tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .6rem; }
  .tile { padding: .7rem .85rem; border-radius: var(--r-item); background: var(--card-2); }
  .tile span { display: block; color: var(--muted); font-size: .6875rem; }
  .tile .big { display: block; margin-block: .3rem .15rem; color: var(--tint, var(--ink)); }
  .tile em { display: block; color: var(--ink-2); font-size: .625rem; font-style: normal; }

  /* ── ranked rows ── */
  .ranks { display: grid; gap: .6rem; }
  .rank { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(3.5rem, 1.7fr) auto; align-items: center; gap: .6rem; --p: var(--claude); }
  .rank-name { min-inline-size: 0; }
  .rank-name b { display: block; font-size: .75rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-name span { display: block; color: var(--muted); font-size: .625rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-track { block-size: 10px; border-radius: var(--r-pill); background: color-mix(in oklab, var(--p) 13%, var(--card-2)); }
  .rank-fill { block-size: 100%; border-radius: var(--r-pill); background: linear-gradient(90deg in oklab, color-mix(in oklab, var(--p) 72%, white 12%), var(--p)); }
  .rank-val { font: 600 .75rem/1 var(--mono); font-variant-numeric: tabular-nums; text-align: end; }

  /* ── tables ── */
  .scroller { overflow-x: auto; scrollbar-width: thin; border-radius: var(--r-item); }
  table { inline-size: 100%; font-size: .75rem; }
  th, td { padding: .5rem .7rem; text-align: end; white-space: nowrap; border-block-end: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: start; }
  thead th { color: var(--muted); font-size: .6875rem; font-weight: 600; background: var(--card-2); position: sticky; inset-block-start: 0; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody tr { content-visibility: auto; contain-intrinsic-block-size: auto 2.1lh; }
  tbody tr:hover { background: color-mix(in oklab, var(--claude) 7%, transparent); }
  .tag { display: inline-flex; align-items: center; gap: .35rem; color: var(--ink-2); }
  .tag::before { content: ""; inline-size: 9px; block-size: 9px; border-radius: 3px; background: var(--p); }
  .truncate { max-inline-size: 20rem; overflow: hidden; text-overflow: ellipsis; }

  details { border-radius: var(--r-item); overflow: clip; }
  details + details { margin-block-start: .5rem; }
  summary {
    min-block-size: 48px; display: flex; align-items: center; gap: .55rem; cursor: pointer;
    font-weight: 600; font-size: .8125rem; padding-inline: 1rem; background: var(--card-2);
  }
  summary .count { color: var(--muted); font: 500 .6875rem/1 var(--mono); }
  summary .chev { margin-inline-start: auto; color: var(--muted); transition: rotate .18s ease; }
  details[open] summary .chev { rotate: 90deg; }

  .empty { display: grid; place-items: center; min-block-size: 4rem; padding: .9rem; border-radius: var(--r-item); background: var(--card-2); color: var(--muted); font-size: .75rem; text-align: center; text-wrap: pretty; }
  /* an unavailable provider must not stretch to match its neighbour's height */
  #quota { align-items: start; }

  footer { margin-block-start: 1.5rem; display: flex; flex-wrap: wrap; gap: .3rem 1rem; color: var(--muted); font-size: .6875rem; padding-inline: .3rem; }
  footer .grow { margin-inline-start: auto; overflow-wrap: anywhere; }

  .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hide { display: none !important; }
  .skip { position: fixed; inset-inline-start: 12px; inset-block-start: 10px; z-index: 80; translate: 0 -180%; background: var(--ink); color: var(--canvas); padding: .5rem .8rem; border-radius: var(--r-item); }
  .skip:focus { translate: 0 0; }
}

@layer chart {
  .chart-box { inline-size: 100%; }
  .chart { display: block; inline-size: 100%; block-size: auto; overflow: visible; }
  .gridline { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .axis { fill: var(--muted); font: 10px var(--mono); font-variant-numeric: tabular-nums; }
  .callout { fill: var(--ink); font: 600 10px var(--mono); font-variant-numeric: tabular-nums; }
  .series-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .hit { fill: transparent; cursor: crosshair; }
  .marker { stroke: var(--card); stroke-width: 2.5; }
  .arc-fill { fill: none; stroke-linecap: round; }
  /* polar spokes are wide strokes; a round cap would balloon each one into a
     blob that overlaps its neighbours */
  .spoke { fill: none; stroke-linecap: butt; }
  .cell { shape-rendering: crispEdges; }

  #tip {
    position: fixed; z-index: 70; pointer-events: none; opacity: 0;
    padding: .45rem .6rem; border-radius: 10px;
    background: light-dark(#26292f, #eef1f6); color: light-dark(#fff, #12141a);
    box-shadow: 0 8px 22px rgb(0 0 0 / .28);
    font: .6875rem/1.5 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
    transition: opacity .12s ease;
  }

  #loader { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--canvas); transition: opacity .3s ease; }
  #loader.done { opacity: 0; pointer-events: none; }
  .boot { inline-size: min(26rem, calc(100vw - 2.5rem)); text-align: center; }
  .boot .brand-badge { margin-inline: auto; }
  .boot-line { block-size: 4px; border-radius: var(--r-pill); margin-block-start: 1.3rem; background: var(--card-2); overflow: hidden; }
  .boot-line::after {
    content: ""; display: block; inline-size: 38%; block-size: 100%; border-radius: var(--r-pill);
    background: linear-gradient(90deg in oklab, var(--claude), var(--c2));
    animation: sweep 1.25s ease-in-out infinite;
  }
  .boot p { margin-block-start: .85rem; color: var(--muted); font-size: .75rem; }
  @keyframes sweep { from { translate: -100% 0; } to { translate: 300% 0; } }

  #app { opacity: 0; transition: opacity .3s ease; }
  #app.show { opacity: 1; }
}

@layer utilities {
  @media (prefers-reduced-motion: reduce) {
    .boot-line::after { animation: none; inline-size: 100%; }
    #loader, #app, summary .chev, #tip, .seg button, .iconbtn { transition: none; }
  }
  @media (pointer: coarse) { .seg button, .iconbtn { min-block-size: 42px; } }
}
</style>
</head>

    <path d="M12 3.2c1.4 3.6 4 6.2 7.6 7.6-3.6 1.4-6.2 4-7.6 7.6-1.4-3.6-4-6.2-7.6-7.6C8 9.4 10.6 6.8 12 3.2Z"/>

<script>

  function untilText(iso) {

  var GLYPHS = {

    "3": "11111,00010,00100,00010,00001,10001,01110",
    "4": "00010,00110,01010,10010,11111,00010,00010",

    "8": "01110,10001,10001,01110,10001,10001,01110",
    "9": "01110,10001,10001,01111,00001,00010,01100",
    "$": "00100,01111,10100,01110,00101,11110,00100",

    ".": "00000,00000,00000,00000,00000,01100,01100",
    "%": "11001,11010,00010,00100,01000,01011,10011",
    "+": "00000,00100,00100,11111,00100,00100,00000",
    "-": "00000,00000,00000,11111,00000,00000,00000",
    ":": "00000,01100,01100,00000,01100,01100,00000",
    "/": "00001,00010,00010,00100,01000,01000,10000",
    " ": "00000,00000,00000,00000,00000,00000,00000",
    "A": "01110,10001,10001,11111,10001,10001,10001",
    "B": "11110,10001,10001,11110,10001,10001,11110",
    "C": "01110,10001,10000,10000,10000,10001,01110",
    "D": "11100,10010,10001,10001,10001,10010,11100",
    "E": "11111,10000,10000,11110,10000,10000,11111",
    "F": "11111,10000,10000,11110,10000,10000,10000",
    "G": "01110,10001,10000,10111,10001,10001,01111",
    "H": "10001,10001,10001,11111,10001,10001,10001",
    "I": "01110,00100,00100,00100,00100,00100,01110",
    "J": "00111,00010,00010,00010,00010,10010,01100",
    "K": "10001,10010,10100,11000,10100,10010,10001",
    "L": "10000,10000,10000,10000,10000,10000,11111",
    "M": "10001,11011,10101,10101,10001,10001,10001",
    "N": "10001,11001,10101,10011,10001,10001,10001",
    "O": "01110,10001,10001,10001,10001,10001,01110",
    "P": "11110,10001,10001,11110,10000,10000,10000",
    "Q": "01110,10001,10001,10001,10101,10010,01101",

    "S": "01111,10000,10000,01110,00001,00001,11110",
    "T": "11111,00100,00100,00100,00100,00100,00100",
    "U": "10001,10001,10001,10001,10001,10001,01110",
    "V": "10001,10001,10001,10001,10001,01010,00100",
    "W": "10001,10001,10001,10101,10101,11011,10001",
    "X": "10001,10001,01010,00100,01010,10001,10001",
    "Y": "10001,10001,01010,00100,00100,00100,00100",
    "Z": "11111,00001,00010,00100,01000,10000,11111"
  };

  function pixelWidth(text, px) {
    var count = String(text).toUpperCase().split("").filter(function (c) { return GLYPHS[c]; }).length;
    return count ? (count * 6 - 1) * px : 0;
  }
  // `pos` places the result inside another SVG; omit it for inline HTML use.
  function pixel(text, px, color, pos) {
    var chars = String(text).toUpperCase().split("").filter(function (c) { return GLYPHS[c]; });
    if (!chars.length) return "";
    var cols = chars.length * 6 - 1;
    var w = cols * px, h = 7 * px, rects = "", x0 = 0;
    chars.forEach(function (c) {
      GLYPHS[c].split(",").forEach(function (row, r) {
        var start = -1;
        for (var i = 0; i <= 5; i++) {
          var on = row[i] === "1";

      ' width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" aria-hidden="true" focusable="false" fill="' + (color || "currentColor") + '" shape-rendering="crispEdges">' + rects + "</svg>";
  }
  function figure(text, px, color) {
    return pixel(text, px, color) + '<span class="sr-only">' + esc(text) + "</span>";
  }

  function pname(p) { return p === "claude" ? "Claude" : "Codex"; }
  function pcolor(p) { return p === "claude" ? "var(--claude)" : "var(--codex)"; }
  function shown() { return filter === "all" ? ["claude", "codex"] : [filter]; }
  function report(p, key) {
    var slot = data && data.reports && data.reports[key || period];
    return (slot && slot[p]) || {};
  }
  function overview(p) { return report(p).overview || { tokens: {} }; }
  function cost(p) { var o = overview(p); return n(o.netCost != null ? o.netCost : o.cost); }
  function tokens(p) { return (report(p).overview && report(p).overview.tokens) || {}; }
  function tokTotal(t) { return n(t.input) + n(t.output) + n(t.cacheRead) + n(t.cacheWrite); }

  var TOKEN_PARTS = [
    { key: "input", label: "输入", css: "var(--c1)" },
    { key: "output", label: "输出", css: "var(--c2)" },
    { key: "cacheRead", label: "缓存读", css: "var(--c3)" },
    { key: "cacheWrite", label: "缓存写", css: "var(--c4)" }
  ];
  var SLOTS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
  var RAMP = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];

  /* ── chart plumbing: draw at the container's real pixel width so 10px axis

  function register(host, draw) { charts.push({ host: host, draw: draw }); paint(host, draw); }
  function paint(host, draw) {
    var w = Math.max(180, Math.round(host.clientWidth || 0));
    if (!w) return;
    host.innerHTML = draw(w);
    wireHover(host);
  }
  function repaintAll() { charts.forEach(function (c) { paint(c.host, c.draw); }); }
  var ro = new ResizeObserver(function (entries) {
    entries.forEach(function (e) {

  function svgOpen(w, h, label) {
    return '<svg class="chart" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label) + '">';
  }

      el.addEventListener("mousemove", function (e) {
        tip.style.insetInlineStart = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
        tip.style.insetBlockStart = Math.max(8, e.clientY - 14) + "px";

      el.addEventListener("mouseleave", function () { tip.style.opacity = "0"; });
    });
  }
  function niceMax(v) {
    if (v <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / (mag / 2)) * (mag / 2);
  }
  function arc(cx, cy, r, a0, a1) {
    var p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)];
    var p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];

      "A" + r + " " + r + " 0 " + ((a1 - a0) > Math.PI ? 1 : 0) + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
  }

  /* ─────────────────────── ① 当前额度 · 分段方块表 ── */
  // Severity follows the fill, so the bar itself says how close to the wall you are.
  function sevColor(pct) { return pct >= 100 ? "var(--danger)" : pct >= 85 ? "var(--danger)" : pct >= 60 ? "var(--warn)" : "var(--good)"; }
  function blockMeter(pct, blocks) {
    blocks = blocks || 28;
    var filled = Math.round(Math.min(100, Math.max(0, pct)) / 100 * blocks);

        '<span class="meter-pct" style="--sev:' + sev + '">' + Math.round(pct) + "%</span>" +
        (note ? '<span class="meter-note">' + esc(note) + "</span>" : "") +
      "</div>" +
      blockMeter(pct) +
      (resetsAt ? '<div class="meter-foot"><span>' + esc(untilText(resetsAt)) + "</span><span>" + esc(dayClock(resetsAt)) + " 重置</span></div>" : "") +
      "</div>";
  }

  function quotaReason(code) {
    var map = {
      no_credentials: "未找到 Claude 登录凭据",
      token_expired: "登录凭据已过期，请在 Claude Code 中重新登录",
      rate_limited: "额度接口暂时限流",
      failed_local: "无法连接 Claude 服务",
      malformed_response: "服务端返回了无法解析的内容"
    };
    if (map[code]) return map[code];
    if (code && code.indexOf("token_rejected") === 0) return "登录凭据被拒绝，请在 Claude Code 中重新登录";
    return "未能取得额度数据" + (code ? "（" + code + "）" : "");
  }

  function renderQuota() {
    var host = $("quota"), out = [];
    var q = (data.limits && data.limits.claudeQuota) || {};

    if (filter !== "codex") {
      var rows = "", alarm = "";
      if (q.ok) {
        var byKind = {};
        (q.limits || []).forEach(function (l) { byKind[l.kind] = l; });
        var session = byKind.session, weekly = byKind.weekly_all, scoped = byKind.weekly_scoped;

        if (q.fiveHour && q.fiveHour.utilization != null) {
          rows += meterRow("5 小时会话额度", n(q.fiveHour.utilization), q.fiveHour.resetsAt, null);
        }
        if (q.sevenDay && q.sevenDay.utilization != null) {
          rows += meterRow("7 天总额度", n(q.sevenDay.utilization), q.sevenDay.resetsAt, null);
        }
        if (scoped && scoped.percent != null) {
          rows += meterRow((scoped.model ? scoped.model : "按模型") + " 专项额度", n(scoped.percent), scoped.resetsAt, scoped.isActive ? "正在生效" : null);
        }

        if (blocked.length) {
          var names = blocked.map(function (l) { return l.kind === "weekly_scoped" ? (l.model || "按模型") + " 专项额度" : l.kind === "weekly_all" ? "7 天总额度" : "5 小时额度"; });
          alarm = '<p class="alarm"><svg aria-hidden="true"><use href="#i-alert"/></svg>' +
            esc(names.join("、")) + " 已用尽，相关请求会被拒绝</p>";
        }
      } else {
        rows = '<p class="empty">' + esc(quotaReason(q.reason)) + "，下方为本地会话窗口的估算。</p>";
      }
      if (q.ok && q.stale) {
        rows = '<p class="stale"><svg aria-hidden="true"><use href="#i-alert"/></svg>' +
          esc(quotaReason(q.staleReason)) + "，显示的是 " + esc(clock(q.cachedAt)) + " 的缓存额度</p>" + rows;
      }

      // ccusage still supplies burn rate and projected spend, which the quota endpoint does not
      var blocks = data.limits && data.limits.claudeBlocks && data.limits.claudeBlocks.blocks;
      var live = (blocks || []).filter(function (b) { return b.isActive && !b.isGap; })[0];
      var extra = "";
      if (live) {
        var burn = live.burnRate && live.burnRate.costPerHour;
        extra = '<div class="prov-stats" style="border-block-start:1px solid var(--line);padding-block-start:.65rem">' +
          '<div><span>本窗口已用</span><b>' + usd(live.costUSD) + "</b></div>" +
          "<div><span>燃烧率</span><b>" + (burn ? usd(burn) + "/时" : "-") + "</b></div>" +
          "<div><span>按此速预计</span><b>" + (live.projection && live.projection.totalCost ? usd(live.projection.totalCost) : "-") + "</b></div></div>";
      }

      out.push('<article class="card quota" style="--p:var(--claude)">' +
        '<div class="quota-head"><span class="dot"></span><h3>Claude 额度</h3>' +
        '<span class="quota-src">' + (q.ok ? (q.stale ? "缓存" : "服务端下发") : "不可用") + "</span></div>" +
        alarm + rows + extra + "</article>");
    }

    if (filter !== "claude") {
      var cx = (data.limits && data.limits.codex) || {};
      var body;
      if (cx.primary && cx.primary.used_percent != null) {
        body = meterRow("主限额", n(cx.primary.used_percent), cx.primary.resets_at, null) +
          (cx.secondary && cx.secondary.used_percent != null ? meterRow("次限额", n(cx.secondary.used_percent), cx.secondary.resets_at, null) : "");
      } else {
        body = '<p class="empty">当前服务商未返回可显示的限额数据。自定义服务商通常不下发 rate_limits 字段。</p>';
      }
      out.push('<article class="card quota" style="--p:var(--codex)">' +
        '<div class="quota-head"><span class="dot"></span><h3>Codex 额度</h3>' +
        '<span class="quota-src">' + (cx.primary ? "会话记录" : "不可用") + "</span></div>" + body + "</article>");
    }

    host.innerHTML = out.join("");
  }

  /* ─────────────────────────────── ② hero ── */
  function dailyRows(key) {
    var map = {};
    ["claude", "codex"].forEach(function (p) {
      (report(p, key).daily || []).forEach(function (d) {
        if (!map[d.date]) map[d.date] = { date: d.date, claude: 0, codex: 0 };
        map[d.date][p] = n(d.cost);
      });
    });
    return Object.keys(map).sort().map(function (k) { return map[k]; });
  }
  function rowTotal(r) { return shown().reduce(function (s, p) { return s + r[p]; }, 0); }

  function renderHero() {
    var sel = shown();
    var total = sum(sel.map(cost));
    var calls = sum(sel.map(function (p) { return overview(p).calls; }));
    var sess = sum(sel.map(function (p) { return overview(p).sessions; }));
    var toks = sum(sel.map(function (p) { return tokTotal(tokens(p)); }));
    var cr = sum(sel.map(function (p) { return n(tokens(p).cacheRead); }));

    $("heroLabel").textContent = (filter === "all" ? "Claude + Codex 合计" : pname(filter)) + " · API 参考价";
    $("heroFigure").innerHTML = figure(usd(total, false), 7, "var(--claude)");
    $("heroFacts").innerHTML = [
      ["调用", int(calls)], ["会话", int(sess)], ["Tokens", kmb(toks)],
      ["缓存读占比", (toks ? (cr / toks * 100).toFixed(1) : "0") + "%"]
    ].map(function (f) { return "<div><span>" + f[0] + "</span><b>" + f[1] + "</b></div>"; }).join("");

    var rows = dailyRows(), host = $("heroSpark");
    if (rows.length < 2) { host.innerHTML = ""; return; }
    register(host, function (w) {
      var h = 48, pad = 4;
      var vals = rows.map(rowTotal), max = Math.max.apply(null, vals.concat([1]));
      var step = (w - pad * 2) / (vals.length - 1);
      var pts = vals.map(function (v, i) { return [pad + i * step, h - pad - v / max * (h - pad * 2)]; });
      var line = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("");
      var last = pts[pts.length - 1];
      return svgOpen(w, h, "周期内每日合计走势") +
        '<defs><linearGradient id="sparkFade" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="var(--claude)" stop-opacity=".28"/>' +
        '<stop offset="1" stop-color="var(--claude)" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + line + "L" + last[0].toFixed(1) + " " + h + "L" + pad + " " + h + '" fill="url(#sparkFade)"/>' +
        '<path class="series-line" d="' + line + '" stroke="var(--claude)"/>' +
        '<circle class="marker" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="var(--claude)"/>' + "</svg>";
    });
    ro.observe(host);
  }

  /* ──────────────────────────── ③ provider cards ── */
  function renderSplit() {

    $("split").innerHTML = ["claude", "codex"].map(function (p) {

        '<div class="prov-stats">' +

  /* ───────────────────── ④ 每日成本 · 面积 + 折线 ── */
  function renderTrend() {
    var rows = dailyRows(), sel = shown(), host = $("trendChart");
    $("trendCap").textContent = PERIOD_LABEL[period] + "，" + (sel.length > 1 ? "两个提供商分别成线" : pname(sel[0]));
    if (rows.length < 2) {
      host.innerHTML = '<p class="empty">该周期内不足两天数据，无法绘制走势</p>';
      $("trendTable").innerHTML = ""; $("trendTotal").textContent = ""; $("trendLegend").innerHTML = "";
      return;
    }
    var totals = rows.map(rowTotal);
    $("trendTotal").textContent = usd(sum(totals), false) + " 合计";
    $("trendLegend").innerHTML = sel.map(function (p) {
      return '<span><i style="background:' + pcolor(p) + '"></i><span translate="no">' + pname(p) + "</span> <b>" +
        usd(sum(rows.map(function (r) { return r[p]; })), false) + "</b></span>";
    }).join("");

    register(host, function (w) {
      var h = 240, ml = 8, mr = 56, mt = 24, mb = 26;
      var pw = w - ml - mr, ph = h - mt - mb;
      var max = niceMax(Math.max.apply(null, totals.concat([0.01])));
      var step = pw / Math.max(1, rows.length - 1);
      var x = function (i) { return ml + i * step; };
      var y = function (v) { return mt + ph - v / max * ph; };
      var s = svgOpen(w, h, PERIOD_LABEL[period] + "每日 API 参考成本走势") + "<defs>";
      sel.forEach(function (p) {
        s += '<linearGradient id="fade-' + p + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="' + pcolor(p) + '" stop-opacity=".3"/>' +
          '<stop offset="1" stop-color="' + pcolor(p) + '" stop-opacity="0"/></linearGradient>';
      });
      s += "</defs>";
      [0, 0.5, 1].forEach(function (f) {
        var gy = mt + ph - ph * f;
        s += '<line class="gridline" x1="' + ml + '" y1="' + gy + '" x2="' + (w - mr) + '" y2="' + gy + '"/>' +
          '<text class="axis" x="' + (w - mr + 7) + '" y="' + (gy + 3.5) + '">' + usd(max * f, max * f < 100) + "</text>";
      });
      sel.forEach(function (p) {
        var pts = rows.map(function (r, i) { return [x(i), y(r[p])]; });
        var line = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("");
        s += '<path d="' + line + "L" + x(rows.length - 1).toFixed(1) + " " + (mt + ph) + "L" + ml + " " + (mt + ph) + '" fill="url(#fade-' + p + ')"/>' +
          '<path class="series-line" d="' + line + '" stroke="' + pcolor(p) + '"/>';
      });
      var peak = totals.indexOf(Math.max.apply(null, totals));
      s += '<text class="callout" x="' + Math.min(w - mr - 6, Math.max(ml + 30, x(peak))) + '" y="' + (y(totals[peak]) - 10) +
        '" text-anchor="middle">' + (sel.length > 1 ? "合计 " : "") + usd(totals[peak]) + "</text>";
      sel.forEach(function (p) {
        s += '<circle class="marker" cx="' + x(peak).toFixed(1) + '" cy="' + y(rows[peak][p]).toFixed(1) + '" r="4.5" fill="' + pcolor(p) + '"/>';
      });
      var every = Math.max(1, Math.ceil(rows.length / 7));
      rows.forEach(function (r, i) {
        if (i % every === 0 || i === rows.length - 1) {
          s += '<text class="axis" x="' + Math.min(w - mr, Math.max(ml + 14, x(i))) + '" y="' + (h - 7) + '" text-anchor="middle">' + r.date.slice(5) + "</text>";
        }
        s += '<rect class="hit" x="' + (x(i) - step / 2).toFixed(1) + '" y="' + mt + '" width="' + step.toFixed(1) + '" height="' + ph + '" data-tip="' +
          esc(r.date) + "<br>" + sel.map(function (p) { return pname(p) + " " + usd(r[p]); }).join("<br>") +
          (sel.length > 1 ? "<br>合计 " + usd(totals[i]) : "") + '"/>';
      });
      return s + "</svg>";
    });
    ro.observe(host);

    $("trendTable").innerHTML = '<table><caption class="sr-only">每日 API 参考成本</caption><thead><tr><th>日期</th>' +
      sel.map(function (p) { return '<th translate="no">' + pname(p) + "</th>"; }).join("") +
      (sel.length > 1 ? "<th>合计</th>" : "") + "</tr></thead><tbody>" +
      rows.map(function (r, i) {
        return "<tr><td>" + r.date + "</td>" + sel.map(function (p) { return '<td class="num">' + usd(r[p]) + "</td>"; }).join("") +
          (sel.length > 1 ? '<td class="num">' + usd(totals[i]) + "</td>" : "") + "</tr>";
      }).join("") + "</tbody></table>";
  }

  /* ──────────────────── ⑤ 活跃度与时段（同一张卡） ── */
  function renderActivity() {
    var rows = dailyRows(), host = $("heatmap");
    $("activityCap").textContent = "日历按天，圆盘按小时（仅 Claude）";
    if (!rows.length) {
      host.innerHTML = '<p class="empty">该周期内没有日粒度数据</p>';
      $("activityTiles").innerHTML = ""; $("heatLegend").innerHTML = ""; $("heatRange").textContent = "";
      $("hoursWrap").classList.add("hide");
      return;
    }

    var byDate = {};
    rows.forEach(function (r) { byDate[r.date] = rowTotal(r); });
    var first = new Date(rows[0].date + "T00:00:00"), last = new Date(rows[rows.length - 1].date + "T00:00:00");
    var days = [];
    for (var d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      days.push({ date: key, value: n(byDate[key]), dow: d.getDay() });
    }
    var active = days.filter(function (x) { return x.value > 0; });
    var peak = days.reduce(function (a, b) { return b.value > a.value ? b : a; }, days[0]);
    var best = 0, run = 0, current = 0;
    days.forEach(function (x) { run = x.value > 0 ? run + 1 : 0; best = Math.max(best, run); });
    for (var i = days.length - 1; i >= 0 && days[i].value > 0; i--) current++;

    $("heatRange").textContent = days[0].date + " → " + days[days.length - 1].date;
    $("activityTiles").innerHTML = [
      ["活跃天数", int(active.length), "共 " + days.length + " 天", "var(--c3)"],
      ["当前连续", int(current) + " 天", current ? "仍在持续" : "最近一天没有用量", "var(--c1)"],
      ["最长连续", int(best) + " 天", "该周期内", "var(--c4)"],
      ["单日峰值", usd(peak.value), peak.date, "var(--claude)"]
    ].map(function (t) {
      return '<article class="tile" style="--tint:' + t[3] + '"><span>' + t[0] + "</span>" +
        '<span class="big">' + figure(t[1], 4, t[3]) + "</span><em>" + esc(t[2]) + "</em></article>";
    }).join("");

    var sorted = active.map(function (x) { return x.value; }).sort(function (a, b) { return a - b; });
    function stepOf(v) {
      if (v <= 0) return -1;
      for (var s = 4; s >= 0; s--) if (v >= sorted[Math.floor(sorted.length * s / 5)]) return s;
      return 0;
    }

    register(host, function (w) {
      var weeks = Math.ceil((days[0].dow + days.length) / 7), gap = 3;
      var cell = Math.max(8, Math.min(16, Math.floor((w - 24 - (weeks - 1) * gap) / weeks)));
      var top = 14, gridW = weeks * (cell + gap) - gap;
      var left = Math.max(22, Math.round((w - gridW) / 2));
      var h = top + 7 * (cell + gap);
      var s = svgOpen(w, h, "每日用量日历热力图");
      ["一", "三", "五"].forEach(function (lbl, k) {
        s += '<text class="axis" x="' + (left - 18) + '" y="' + (top + (k * 2 + 1) * (cell + gap) + cell * 0.78) + '">' + lbl + "</text>";
      });
      var lastMonth = "";
      days.forEach(function (x, idx) {
        var col = Math.floor((days[0].dow + idx) / 7);
        var cx = left + col * (cell + gap), cy = top + x.dow * (cell + gap);
        var st = stepOf(x.value);
        s += '<rect class="cell" rx="2" x="' + cx + '" y="' + cy + '" width="' + cell + '" height="' + cell +
          '" fill="' + (st < 0 ? "var(--card-2)" : RAMP[st]) + '" data-tip="' + esc(x.date) + "<br>" +
          (x.value > 0 ? usd(x.value) : "无用量") + '"/>';
        var month = x.date.slice(5, 7);
        if (month !== lastMonth && x.dow <= 1) { lastMonth = month; s += '<text class="axis" x="' + cx + '" y="9">' + Number(month) + "月</text>"; }
      });
      return s + "</svg>";
    });
    ro.observe(host);

    $("heatLegend").innerHTML =
      '<span><i style="background:var(--card-2)"></i>无用量</span>' +
      '<span style="gap:.2rem">少' + RAMP.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + "多</span>";

    renderHours(rows);
  }

  function renderHours(rows) {
    var wrap = $("hoursWrap"), host = $("hoursChart");
    var blocks = data.limits && data.limits.claudeBlocks && data.limits.claudeBlocks.blocks;
    if (filter === "codex" || !blocks || !blocks.length) { wrap.classList.add("hide"); return; }

    var from = new Date(rows[0].date + "T00:00:00").getTime();
    var to = new Date(rows[rows.length - 1].date + "T23:59:59").getTime();
    var hours = new Array(24).fill(0), used = 0;
    blocks.forEach(function (b) {
      if (b.isGap || !b.startTime) return;
      var s = new Date(b.startTime).getTime(), e = new Date(b.actualEndTime || b.endTime).getTime();
      if (!(e > s) || e < from || s > to) return;
      used++;
      var span = e - s, c = n(b.costUSD);
      for (var t = s; t < e; ) {                     // spread across the hours it actually spanned
        var slot = new Date(t), next = new Date(slot);
        next.setMinutes(0, 0, 0); next.setHours(next.getHours() + 1);
        var chunk = Math.min(next.getTime(), e) - t;
        hours[slot.getHours()] += c * (chunk / span);
        t += chunk;
      }
    });
    if (!used) { wrap.classList.add("hide"); return; }
    wrap.classList.remove("hide");

    var max = Math.max.apply(null, hours.concat([0.01]));
    var peakHour = hours.indexOf(Math.max.apply(null, hours));
    $("hoursCap").textContent = "峰值 " + peakHour + ":00，按 " + used + " 个 5 小时窗口的实际跨度摊分";

    register(host, function (w) {
      var size = Math.min(w, 260), c = size / 2, rMax = c - 26, rMin = 20;
      var s = svgOpen(w, size, "24 小时用量分布");
      var ox = (w - size) / 2 + c;
      [0.5, 1].forEach(function (f) {
        s += '<circle class="gridline" fill="none" cx="' + ox + '" cy="' + c + '" r="' + (rMin + (rMax - rMin) * f) + '"/>';
      });
      hours.forEach(function (v, hr) {
        var a0 = (hr / 24) * Math.PI * 2 - Math.PI / 2 + 0.018;
        var a1 = ((hr + 1) / 24) * Math.PI * 2 - Math.PI / 2 - 0.018;
        var len = rMin + (rMax - rMin) * (v / max);
        var isPeak = hr === peakHour;
        s += '<path class="spoke" d="' + arc(ox, c, (rMin + len) / 2, a0, a1) + '" stroke="' +
          (isPeak ? "var(--c2)" : "var(--claude)") + '" stroke-width="' + Math.max(1, len - rMin) +
          '" opacity="' + (isPeak ? 1 : 0.62) + '" data-tip="' + hr + ":00-" + ((hr + 1) % 24) + ':00<br>' + usd(v) + '"/>';
      });
      [0, 6, 12, 18].forEach(function (hr) {
        var a = (hr / 24) * Math.PI * 2 - Math.PI / 2;
        s += '<text class="axis" x="' + (ox + Math.cos(a) * (rMax + 12)).toFixed(1) + '" y="' + (c + Math.sin(a) * (rMax + 12) + 3.5).toFixed(1) +
          '" text-anchor="middle">' + hr + "时</text>";
      });
      return s + "</svg>";
    });
    ro.observe(host);
  }

  /* ─────────────────────────── ⑥ 模型构成 · 环形 ── */
  function modelSlotMap() {
    // colour follows the model, not its rank in the current filter, so filtering
    // never repaints the survivors
    var all = {};
    ["claude", "codex"].forEach(function (p) {
      (report(p).models || []).forEach(function (m) { all[m.name] = (all[m.name] || 0) + n(m.cost); });
    });
    var map = {};
    Object.keys(all).sort(function (a, b) { return all[b] - all[a]; })
      .forEach(function (name, i) { map[name] = i < 6 ? SLOTS[i] : "var(--c-rest)"; });
    return map;
  }
  function collect(key) {
    var out = [];
    shown().forEach(function (p) { (report(p)[key] || []).forEach(function (item) { out.push({ p: p, item: item }); }); });
    return out.sort(function (a, b) { return n(b.item.cost) - n(a.item.cost); });
  }

  function renderModels() {
    var models = collect("models"), host = $("modelDonut");
    $("modelTotal").textContent = "共 " + models.length + " 个模型";
    if (!models.length) { host.innerHTML = '<p class="empty">该筛选下没有模型数据</p>'; $("modelLegend").innerHTML = ""; return; }
    var slots = modelSlotMap();
    var total = sum(models.map(function (x) { return x.item.cost; })) || 1;
    var parts = models.slice(0, 5).map(function (x) {
      return { name: x.item.name, provider: x.p, value: n(x.item.cost), color: slots[x.item.name] || "var(--c-rest)" };
    });
    var rest = models.slice(5);
    if (rest.length) {
      parts.push({ name: "其他 " + rest.length + " 个", provider: null, value: sum(rest.map(function (x) { return x.item.cost; })), color: "var(--c-rest)" });
    }

    register(host, function (w) {
      var size = Math.min(w, 240), c = size / 2, sw = 24, r = c - sw / 2 - 2;
      var s = svgOpen(w, size, "模型参考成本构成环形图");
      var ox = (w - size) / 2, a = -Math.PI / 2, gapAngle = 2.5 / r;
      parts.forEach(function (part) {
        var span = part.value / total * Math.PI * 2;
        if (span > gapAngle) {
          s += '<path class="arc-fill" d="' + arc(ox + c, c, r, a, a + span - gapAngle) + '" stroke="' + part.color +
            '" stroke-width="' + sw + '" data-tip="' + esc(part.name) + "<br>" + usd(part.value) + " · " +
            (part.value / total * 100).toFixed(1) + '%"/>';
        }
        a += span;
      });
      // inline figure, so mono per the type rule; pixel is reserved for display figures
      s += '<text x="' + (ox + c) + '" y="' + (c + 2) + '" text-anchor="middle" fill="var(--ink)" ' +
        'style="font:700 19px var(--mono);font-variant-numeric:tabular-nums">' + usd(total, false) + "</text>";
      s += '<text class="axis" x="' + (ox + c) + '" y="' + (c + 19) + '" text-anchor="middle">模型合计</text>';
      return s + "</svg>";
    });
    ro.observe(host);

    $("modelLegend").innerHTML = parts.map(function (part) {
      return '<span><i style="background:' + part.color + '"></i>' + esc(part.name) +
        (part.provider ? " · " + pname(part.provider) : "") + " <b>" + usd(part.value) + "</b> " +
        (part.value / total * 100).toFixed(1) + "%</span>";
    }).join("");
  }

  /* ────────────────────────── ⑦ 项目排行 · 条形 ── */
  function renderProjects() {
    var projects = collect("projects"), host = $("projectList");
    $("projectTotal").textContent = projects.length > 8 ? "前 8 / 共 " + projects.length : "共 " + projects.length;
    if (!projects.length) { host.innerHTML = '<p class="empty">该筛选下没有项目数据</p>'; return; }
    var max = Math.max.apply(null, projects.map(function (x) { return n(x.item.cost); }).concat([1]));
    host.innerHTML = projects.slice(0, 8).map(function (x) {
      var it = x.item, name = it.name || it.path || "未命名项目";
      return '<div class="rank" style="--p:' + pcolor(x.p) + '">' +
        '<div class="rank-name"><b title="' + esc(it.path || name) + '">' + esc(name) + "</b>" +
        '<span translate="no">' + pname(x.p) + " · " + int(it.sessions) + " 会话</span></div>" +
        '<div class="rank-track"><div class="rank-fill" style="inline-size:' + (n(it.cost) / max * 100).toFixed(1) + '%"></div></div>' +
        '<div class="rank-val">' + usd(it.cost) + "</div></div>";
    }).join("");
  }

  /* ──────────────────────────────────── ⑧ 明细 ── */
  function table(head, rows) {
    return '<div class="scroller"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
  }
  function tag(p) { return '<span class="tag" style="--p:' + pcolor(p) + '" translate="no">' + pname(p) + "</span>"; }
  function block(title, count, body, open) {
    return '<details class="card"' + (open ? " open" : "") + "><summary>" + title +
      '<span class="count">' + count + '</span><svg class="chev" width="15" height="15" aria-hidden="true"><use href="#i-chev"/></svg></summary>' + body + "</details>";
  }
  function renderDetails() {
    var projects = collect("projects"), models = collect("models");
    var sessions = collect("topSessions").slice(0, 40);
    // 项目明细 is the longest table, so it sits last and stays collapsed
    $("details").innerHTML =
      block("模型明细", models.length, table(["模型", "提供商", "调用", "Tokens", "参考成本"], models.map(function (x) {
        var m = x.item, t = n(m.inputTokens) + n(m.outputTokens) + n(m.cacheReadTokens) + n(m.cacheWriteTokens);
        return "<tr><td>" + esc(m.name) + "</td><td>" + tag(x.p) + '</td><td class="num">' + int(m.calls) +
          '</td><td class="num">' + kmb(t) + '</td><td class="num">' + usd(m.cost) + "</td></tr>";
      })), innerWidth > 720) +
      block("高用量会话", sessions.length, table(["会话", "提供商", "日期", "项目", "调用", "参考成本"], sessions.map(function (x) {
        var s = x.item;
        return '<tr><td class="num">' + esc(String(s.sessionId || "").slice(0, 13)) + "</td><td>" + tag(x.p) + "</td><td>" + esc(s.date || "-") +
          '</td><td class="truncate">' + esc(s.project || "-") + '</td><td class="num">' + int(s.calls) +
          '</td><td class="num">' + usd(s.cost) + "</td></tr>";
      })), false) +
      block("项目明细", projects.length, table(["项目", "提供商", "会话", "调用", "参考成本"], projects.map(function (x) {
        var it = x.item;
        return '<tr><td class="truncate" title="' + esc(it.path || "") + '">' + esc(it.name || it.path || "未命名项目") + "</td><td>" + tag(x.p) +
          '</td><td class="num">' + int(it.sessions) + '</td><td class="num">' + int(it.calls) + '</td><td class="num">' + usd(it.cost) + "</td></tr>";
      })), false);
  }

  function render() {
    charts.length = 0; ro.disconnect();
    renderQuota(); renderHero(); renderSplit(); renderTrend();
    renderActivity(); renderModels(); renderProjects(); renderDetails();
  }

  /* ─────────────────────────────────── wiring ── */
  function syncPressed(nodes, isOn) { nodes.forEach(function (b) { b.setAttribute("aria-pressed", String(isOn(b))); }); }

  function buildPeriodSeg() {
    var keys = (data.periods && data.periods.length ? data.periods : [data.period]).slice();
    if (keys.indexOf(period) < 0) period = keys.indexOf(data.period) >= 0 ? data.period : keys[0];
    $("periodSeg").innerHTML = keys.map(function (k) {
      return '<button type="button" data-period="' + esc(k) + '" aria-pressed="' + (k === period) + '">' + esc(PERIOD_LABEL[k] || k) + "</button>";
    }).join("");
    $("periodSeg").querySelectorAll("[data-period]").forEach(function (b) {
      b.addEventListener("click", function () {
        period = b.dataset.period;
        syncPressed(Array.from($("periodSeg").querySelectorAll("[data-period]")), function (x) { return x === b; });
        syncUrl(); render();
      });
    });
  }
  function syncUrl() {
    var url = new URL(location.href);
    filter === "all" ? url.searchParams.delete("provider") : url.searchParams.set("provider", filter);
    period === (data && data.period) ? url.searchParams.delete("period") : url.searchParams.set("period", period);
    history.replaceState(null, "", url);
  }

  document.querySelectorAll("[data-filter]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.filter;
      syncPressed(Array.from(document.querySelectorAll("[data-filter]")), function (x) { return x === b; });
      syncUrl(); render();
    });
  });

  var chartBtn = $("trendChartBtn"), tableBtn = $("trendTableBtn");
  function trendView(asTable) {
    $("trendChart").classList.toggle("hide", asTable);
    $("trendTable").classList.toggle("hide", !asTable);
    chartBtn.setAttribute("aria-pressed", String(!asTable));
    tableBtn.setAttribute("aria-pressed", String(asTable));
    if (!asTable) repaintAll();
  }
  chartBtn.addEventListener("click", function () { trendView(false); });
  tableBtn.addEventListener("click", function () { trendView(true); });

  /* two-state theme: system default ⇄ pinned opposite */
  var meta = document.querySelector('meta[name="color-scheme"]');
  var mq = matchMedia("(prefers-color-scheme: dark)");
  function isDark() { var pin = document.documentElement.dataset.cs; return pin ? pin === "dark" : mq.matches; }
  function syncTheme() {
    $("themeBtn").setAttribute("aria-pressed", String(!!document.documentElement.dataset.cs));
    $("themeColor").setAttribute("content", isDark() ? "#12141a" : "#f4f2ed");
  }
  mq.addEventListener("change", function () { syncTheme(); repaintAll(); });
  $("themeBtn").addEventListener("click", function () {
    if (document.documentElement.dataset.cs) {
      delete document.documentElement.dataset.cs;
      meta.content = "light dark";
      try { localStorage.removeItem("ai-usage-ledger-theme"); } catch (e) {}
    } else {
      var next = mq.matches ? "light" : "dark";
      document.documentElement.dataset.cs = next;
      meta.content = next;
      try { localStorage.setItem("ai-usage-ledger-theme", next); } catch (e) {}
    }
    syncTheme(); repaintAll();
  });
  syncTheme();

  var q = new URLSearchParams(location.search);
  if (["all", "claude", "codex"].indexOf(q.get("provider")) >= 0) filter = q.get("provider");
  if (q.get("period")) period = q.get("period");
  syncPressed(Array.from(document.querySelectorAll("[data-filter]")), function (b) { return b.dataset.filter === filter; });
  $("wordmark").innerHTML = pixel("AI USAGE", 3, "currentColor");

  addEventListener("resize", function () { clearTimeout(window.__rz); window.__rz = setTimeout(repaintAll, 150); });

  /* ─────────────────────────── data intake ── */
  window.__render__ = function () {
    data = window.__DATA__ || {};
    if (data.period && !q.get("period")) period = data.period;
    buildPeriodSeg();
    $("stamp").textContent = "生成于 " + stampAt(data.generatedAt) + " · " + (PERIOD_LABEL[period] || period);
    $("source").textContent = (data.source && data.source.name ? data.source.name : "本地统计") + (data.source && data.source.version ? " " + data.source.version : "");
    $("location").textContent = data.appDir || "";
    render();
    clearInterval(bootTimer);
    $("app").classList.add("show");
    $("loader").classList.add("done");
    setTimeout(function () { $("loader").style.display = "none"; }, 340);
  };

  var attempts = 0;
  (function load() {
    var script = document.createElement("script");
    script.src = "data.js?t=" + Date.now();
    script.onload = function () { script.remove(); };
    script.onerror = function () {
      script.remove();
      attempts += 1;
      if (attempts < 300) setTimeout(load, 500);
      else $("bootMessage").textContent = "数据生成超时，请重新启动";
    };
    document.body.appendChild(script);
  })();
})();
</script>
</body>
</html>
