<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#ecebe6">
<link rel="icon" href="data:,">
<title>AI Usage</title>
<script>
/* Pin the stored scheme before first paint so a pinned theme never flashes. */
{
  var saved = null;
  try { saved = localStorage.getItem("ai-usage-ledger-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") {
    document.querySelector('meta[name="color-scheme"]').content = saved;
    document.documentElement.dataset.cs = saved;
  }
  /* Same idea for motion: decide before the first frame, not after it. */
  var motion = null;
  try { motion = localStorage.getItem("ai-usage-ledger-motion"); } catch (e) {}
  if (motion === "full") document.documentElement.dataset.motion = "full";
  else if (motion === "off") document.documentElement.dataset.motion = "off";
  /* The first frame waits for the pixel fonts and the first data read (showPage in the
     page script), but never longer than this: a page that cannot get there still shows. */
  document.documentElement.dataset.boot = "";
  setTimeout(function () {
    if (typeof window.__show__ === "function") window.__show__();
    else delete document.documentElement.dataset.boot;
  }, 1200);
}
</script>
<style>
@font-face {
  font-family: "Ark Pixel 12px";
  src: url("ark-pixel-12px-monospaced-zh_cn.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: block;
}
@font-face {
  font-family: "Fusion Pixel 12px";
  src: url("fusion-pixel-12px-monospaced-zh_hans.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: block;
}
@layer reset, base, components, chart, utilities;

@layer reset {
  html { box-sizing: border-box; color-scheme: light dark; }
  html[data-cs="light"] { color-scheme: light; }
  html[data-cs="dark"] { color-scheme: dark; }
  body, h1, h2, h3, p, figure { margin: 0; }
  :where(div, section, article, header, footer, aside, main, span, b, i, em, table, thead, tbody, tr, th, td, details, summary, button, svg, p) { box-sizing: border-box; }
  :where(button) { font: inherit; color: inherit; background: none; border: 0; }
  :where(table) { border-collapse: collapse; }
  :where(summary) { list-style: none; }
  :where(summary)::-webkit-details-marker { display: none; }
}

@layer base {
  :root {
    /* ── surfaces: compact desktop UI with hard, tactile depth ── */
    --canvas:   light-dark(#ecebe6, #11140f);
    --card:     light-dark(#fffef9, #1b2018);
    --card-2:   light-dark(#f1efe8, #252b21);
    --ink:      light-dark(#20231f, #f3f0df);
    --ink-2:    light-dark(#4d524a, #c3c5b6);
    --muted:    light-dark(#666b62, #a9af9f);
    --line:     light-dark(#d3d0c5, #343b30);
    --line-2:   light-dark(#999b91, #66705e);
    --edge:     light-dark(#777b72, #080a07);

    /* ── provider identity: reserved, never a series slot ── */
    --claude:   light-dark(#d9581d, #e05e26);
    --codex:    light-dark(#6a4cf0, #9d8bff);
    --deepseek: light-dark(#4d6bfe, #6b8cff);

    /* ── status: reserved for state, never for "series 4" ── */
    --good:     light-dark(#0f8a4d, #2fbd72);
    --warn:     light-dark(#c2760a, #f0a72a);
    --danger:   light-dark(#d0342c, #ff6b5e);

    /* ── categorical theme, fixed order. Validated: adjacent CVD ΔE ≥ 13.7,
          chroma >= .11, inside each mode's lightness band. Slots 1-4 also carry
          the token rail. The single sub-3:1 slot per mode is relieved by the
          labelled legend and the table views, never by hover alone. ── */
    --c1: #2d74e7;  --c2: #bb0570;  --c3: #00ad76;
    --c4: #943de0;  --c5: #009db9;  --c6: #bc6900;
    --c-rest: var(--muted);

    /* ── activity heatmap: validated retro thermal scale. Hue and lightness both
          move, so adjacent levels survive low-contrast panels and CVD simulation. ── */
    --s1: light-dark(#f7e8b5, #433619);
    --s2: light-dark(#f7b840, #6b561a);
    --s3: light-dark(#ea672d, #b87927);
    --s4: light-dark(#c52e52, #ff8582);
    --s5: light-dark(#63225f, #ffd0e8);

    --font: "Ark Pixel 12px", "Fusion Pixel 12px", "Cascadia Mono", "Microsoft YaHei", monospace;
    --mono: "Ark Pixel 12px", "Fusion Pixel 12px", "Cascadia Mono", Consolas, monospace;

    --r-card: 6px;
    --r-item: 3px;
    --r-pill: 3px;
    --shadow: 3px 3px 0 color-mix(in oklab, var(--edge) 52%, transparent);
  }

  /* The canvas colour lives on `html`, not just `body`: without it the browser
     paints its own white behind the first frame and the loader appears to sit
     on a different shade than the page it hands over to. */
  html { -webkit-text-size-adjust: 100%; background: var(--canvas); }
  /* The scrollbar's lane is always reserved: the page crosses the window's height while it
     loads, and a scrollbar that came and went shifted everything sideways each time. */
  html { scrollbar-gutter: stable; }
  body {
    min-block-size: 100dvh;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: .75rem;
    line-height: 1.65;
    letter-spacing: 0;
    font-synthesis: none;
    accent-color: var(--claude);
    scrollbar-color: var(--line-2) var(--canvas);
    scrollbar-width: thin;
    text-rendering: optimizeSpeed;
  }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; font-weight: 700; letter-spacing: 0; scroll-margin-block-start: 1rem; }
  #app { scroll-margin-block-start: 1rem; }
  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: color-mix(in oklab, var(--claude) 18%, transparent);
  }
  :where(button, summary, a, select, [tabindex]):focus-visible {
    outline: 2px solid var(--codex);
    outline-offset: 2px;
    border-radius: var(--r-item);
  }
  @media (forced-colors: active) {
    .wait-status .caret { forced-color-adjust: none; background: CanvasText; }
    .card, .tile { border: 1px solid CanvasText; }
    :where(button, summary, select):focus-visible { outline: 2px solid Highlight; }
  }
  /* pixel numerals sit on the text baseline like a glyph would */
  .pixtype { display: inline-block; vertical-align: baseline; }
}

@layer components {
  .shell { max-inline-size: 88rem; margin-inline: auto; padding: 1.25rem clamp(.75rem, 2.6vw, 1.75rem) 3rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
  }
  .card-pad { padding: 1rem 1.1rem; }

  /* ── header ── */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
  .brand { display: flex; align-items: center; gap: .7rem; min-inline-size: 0; }
  .brand-badge {
    inline-size: 42px; block-size: 42px; flex: none; display: grid; place-items: center;
    border: 2px solid var(--ink); border-radius: var(--r-item); color: #fff;
    background: var(--claude);
    box-shadow: 4px 4px 0 var(--codex);
  }
  .brand-badge svg { inline-size: 23px; block-size: 23px; }
  .wordmark { color: var(--ink); line-height: 1; display: block; }
  .brand p { color: var(--muted); font-size: .75rem; margin-block-start: .3rem; overflow-wrap: anywhere; }
  .topbar-actions { display: flex; align-items: center; gap: .45rem; margin-inline-start: auto; flex-wrap: wrap; }
  .topbar-tools { display: flex; align-items: center; gap: .45rem; }

  .seg { display: flex; gap: 2px; padding: 3px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: var(--r-pill); box-shadow: inset 1px 1px 0 var(--card); }
  .seg button {
    min-block-size: 30px; padding-inline: .8rem; border-radius: var(--r-pill);
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    color: var(--ink-2); cursor: pointer; font-size: .75rem; white-space: nowrap; border: 1px solid transparent;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .seg button:hover:not([aria-pressed="true"]) { color: var(--ink); background: color-mix(in oklab, var(--ink) 7%, transparent); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; box-shadow: 2px 2px 0 color-mix(in oklab, var(--edge) 55%, transparent); transform: translate(-1px, -1px); }
  .seg button:active { transform: translate(1px, 1px); box-shadow: none; }
  /* A planned period whose report is still being collected: visible, not clickable. */
  .seg button[disabled] { opacity: .42; cursor: default; }
  .seg button[disabled]:hover { background: none; color: inherit; }
  /* `display: inline-flex` above would otherwise override the hidden attribute. */
  .seg button[hidden] { display: none; }
  .iconbtn {
    min-inline-size: 38px; min-block-size: 38px; display: grid; place-items: center;
    border: 1px solid var(--line-2); border-radius: var(--r-pill); background: var(--card); color: var(--ink-2); cursor: pointer;
    box-shadow: 2px 2px 0 color-mix(in oklab, var(--edge) 45%, transparent);
    transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 color-mix(in oklab, var(--edge) 48%, transparent); }
  .iconbtn:active { transform: translate(1px, 1px); box-shadow: none; }
  /* The motion toggle keeps a filled state instead of flashing, so the control
     itself tells the reader whether motion is on. */
  #motionBtn[aria-pressed="true"],
  #motionBtn[aria-pressed="true"]:hover { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .cur {
    block-size: 38px; min-block-size: 38px; border: 1px solid var(--line-2); border-radius: var(--r-pill);
    background: var(--card); color: var(--ink-2); font: 600 .75rem var(--mono); padding: 0 .5rem; cursor: pointer;
  }
  .cur:hover { color: var(--ink); border-color: var(--ink); }

  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .9rem;
    margin-block-start: .9rem; padding: .55rem .85rem;
    border: 1px solid color-mix(in oklab, var(--warn) 45%, var(--line));
    border-radius: var(--r-card);
    background: color-mix(in oklab, var(--warn) 12%, var(--card));
    color: var(--ink-2); font-size: .75rem;
  }
  .notice b { color: light-dark(#8a5406, #f0a72a); }
  .notice .live { display: inline-flex; align-items: center; gap: .4rem; margin-inline-start: auto; white-space: nowrap; }
  .notice .live::before { content: ""; inline-size: 7px; block-size: 7px; border-radius: 1px; background: var(--good); }

  /* ── sections ── */
  .section { margin-block-start: 1.35rem; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; margin-block-end: .75rem; }
  .h2 { font-size: .75rem; }
  .cap { color: var(--muted); font-size: .75rem; }
  .tools { margin-inline-start: auto; display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .total { color: var(--ink-2); font: 600 .75rem/1.4 var(--mono); font-variant-numeric: tabular-nums; }

  .grid-2 { display: grid; gap: .85rem; grid-template-columns: repeat(auto-fit, minmax(min(20rem, 100%), 1fr)); }

  /* ── quota card ── */
  .quota { padding: 1rem 1.1rem; display: grid; gap: .85rem; align-content: start; }
  .quota-head { display: flex; align-items: center; gap: .5rem; }
  .quota-head .dot { inline-size: 10px; block-size: 10px; border-radius: 1px; background: var(--p); flex: none; box-shadow: 2px 2px 0 color-mix(in oklab, var(--p) 35%, transparent); }
  .quota-offline {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .75rem;
    padding: .75rem; border: 1px solid color-mix(in oklab, var(--p) 28%, var(--line));
    border-radius: var(--r-item); background: color-mix(in oklab, var(--p) 5%, var(--card));
  }
  .quota-port {
    inline-size: 34px; block-size: 34px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px;
    padding: 6px; border: 1px solid var(--p); border-radius: var(--r-item);
    box-shadow: 2px 2px 0 color-mix(in oklab, var(--p) 24%, transparent);
  }
  .quota-port i { background: color-mix(in oklab, var(--p) 32%, var(--card)); border: 1px solid color-mix(in oklab, var(--p) 58%, var(--card)); }
  .quota-port i:first-child { background: var(--p); animation: port-blink 1.7s steps(2, end) infinite; }
  .quota-offline-copy { min-inline-size: 0; display: grid; gap: .12rem; }
  .quota-offline-copy b { color: var(--ink); font-size: .75rem; }
  .quota-offline-copy span { color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
  .quota-local-ok { display: inline-flex; align-items: center; gap: .35rem; color: var(--ink-2); font-size: .75rem; white-space: nowrap; }
  .quota-local-ok::before { content: ""; inline-size: 7px; block-size: 7px; border-radius: 1px; background: var(--good); }

  .meter-row { display: grid; gap: .4rem; }
  /* As tall as the figure, so a row keeps its height whether it shows one or "已重置". */
  .meter-top { display: flex; align-items: flex-end; gap: .5rem; flex-wrap: wrap; min-block-size: 1.5rem; }
  .meter-label { color: var(--ink-2); font-size: .75rem; font-weight: 600; }
  .meter-pct { color: var(--sev, var(--good)); font: 700 1.5rem/1 var(--mono); font-variant-numeric: tabular-nums; }
  /* A relay names its own plan, so the note has to shrink rather than overflow. */
  .meter-note { margin-inline-start: auto; color: var(--muted); font-size: .75rem; white-space: nowrap; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; }
  .blocks { display: flex; gap: 2px; }
  .blocks i { flex: 1; block-size: 12px; border-radius: 1px; background: var(--off); }
  .meter-foot { display: flex; gap: .5rem; color: var(--muted); font-size: .75rem; }
  .meter-foot :last-child { margin-inline-start: auto; }
  .alarm {
    display: flex; align-items: center; gap: .45rem; padding: .5rem .7rem;
    border-radius: var(--r-item); font-size: .75rem; font-weight: 600;
    background: color-mix(in oklab, var(--danger) 14%, var(--card));
    color: light-dark(#a5251e, #ff8b80);
  }
  .alarm svg { inline-size: 16px; block-size: 16px; flex: none; }
  .stale {
    display: flex; align-items: center; gap: .45rem; padding: .45rem .7rem;
    border-radius: var(--r-item); font-size: .75rem;
    background: color-mix(in oklab, var(--warn) 15%, var(--card));
    color: light-dark(#8a5406, #f0a72a);
  }
  .stale svg { inline-size: 14px; block-size: 14px; flex: none; }
  .stale-hint { color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
  /* A recorded window that has since rolled over says so instead of showing an old figure. */
  .meter-reset { color: var(--muted); font: 600 .75rem/1.5 var(--mono); }
  .meter-row.is-reset .blocks i { opacity: .5; }

  /* The page is its own first frame. Usage waits in the hero's slot: one pegboard per
     collector step, assembled bead by bead, so the reader sees which provider is being
     collected and how far along it is while the quota above is already readable. */
  .usage-wait { margin-block-start: .85rem; padding: 1rem 1.25rem 1.1rem; display: grid; justify-items: center; gap: .9rem; }
  .usage-wait .hero-label { justify-self: start; }
  .wait-status { margin: 0; display: flex; align-items: center; gap: .35rem; min-block-size: 1.4em; color: var(--ink-2); font-size: .75rem; }
  .wait-status .caret { inline-size: 6px; block-size: 11px; background: currentColor; }
  .usage-wait.failed .wait-status { color: light-dark(#a5251e, #ff8b80); }
  .usage-wait.failed .caret { display: none; }
  #app.usage-pending .usage-block { display: none; }
  #app:not(.usage-pending) .usage-wait { display: none; }
  /* With usage hidden the footer would sit right under the quota and flash there. */
  #app.usage-pending footer { visibility: hidden; }
  .boards { display: flex; justify-content: center; gap: clamp(1rem, 3vw, 1.75rem); }
  .board { margin: 0; display: grid; justify-items: center; gap: .55rem; --p: var(--claude); }
  .board[data-p="codex"] { --p: var(--codex); }
  .board[data-p="deepseek"] { --p: var(--deepseek); }
  .pegboard {
    inline-size: clamp(96px, 10vw, 128px); aspect-ratio: 1; padding: 6px;
    background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-card); box-shadow: var(--shadow);
  }
  .pegboard svg { display: block; inline-size: 100%; block-size: 100%; overflow: visible; }
  .peg { fill: color-mix(in oklab, var(--ink) 17%, transparent); }
  /* An open ring is a bead still being placed; ironing closes it into the solid mark. */
  .bead { opacity: 0; }
  .bead.on { opacity: 1; }
  .bead-body { fill: var(--p); r: .42px; }
  .bead-hole { fill: var(--card); r: .16px; }
  .board.ironed .bead-body { r: .52px; }
  .board.ironed .bead-hole { r: 0px; }
  .board.ironed .peg { opacity: 0; }
  .board-cap { display: flex; align-items: baseline; gap: .45rem; color: var(--muted); font-size: .75rem; white-space: nowrap; }
  .board-cap b { color: var(--ink-2); font-weight: 700; }
  /* The state word stays in body text for contrast; its colour lives in the marker. */
  .board-state { display: inline-flex; align-items: center; gap: .3rem; color: var(--ink-2); }
  .board-state::before { content: ""; inline-size: 7px; block-size: 7px; border-radius: 1px; background: var(--line-2); }
  .board[data-state="run"] .board-state::before { background: var(--p); }
  .board[data-state="done"] .board-state::before { background: var(--good); }
  .board[data-state="halt"] .board-state::before { background: var(--danger); }
  /* Startup punches the pegs row by row, on every board. */
  .pegs > g { opacity: 0; }
  .pegs > g.on { opacity: 1; }
  /* Remembered quota cards hold their shape until the first answer replaces them. */
  .meter-row.is-skeleton .meter-pct, .quota.is-placeholder .prov-stats b { color: var(--muted); }

  /* ── hero ── */
  .hero { position: relative; overflow: hidden; margin-block-start: .85rem; padding: 1.15rem 1.25rem; display: grid; grid-template-columns: minmax(10rem, .75fr) minmax(18rem, 1.5fr) auto; align-items: center; gap: 1rem 1.4rem; }
  .hero-label { color: var(--muted); font-size: .75rem; letter-spacing: 0; }
  .hero-figure { display: block; margin-block-start: .5rem; color: var(--claude); }
  .hero-spark { inline-size: 100%; min-inline-size: 0; block-size: 4.5rem; }
  .hero-facts { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
  .hero-facts div { display: grid; }
  .hero-facts span { color: var(--muted); font-size: .75rem; }
  .hero-facts b { color: var(--ink); font: 700 .75rem/1.3 var(--mono); font-variant-numeric: tabular-nums; }

  /* ── provider cards ── */
  .prov { padding: 1rem 1.1rem; --p: var(--claude); display: grid; gap: .7rem; }
  .prov-top { display: flex; align-items: center; gap: .5rem; }
  .prov-name { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; }
  .prov-name .chip { inline-size: 44px; block-size: 44px; border: 1px solid var(--ink); border-radius: var(--r-item); display: grid; place-items: center; color: #fff; background: var(--p); box-shadow: 2px 2px 0 color-mix(in oklab, var(--p) 35%, transparent); flex: none; }
  .prov-name .chip svg { inline-size: 40px; block-size: 40px; }
  .prov-share { margin-inline-start: auto; padding: .15rem .5rem; border: 1px solid color-mix(in oklab, var(--p) 42%, var(--line)); border-radius: var(--r-item); background: color-mix(in oklab, var(--p) 11%, var(--card)); color: var(--ink); font-size: .75rem; font-weight: 600; }
  .prov-cost-row { display: flex; align-items: end; gap: .35rem; flex-wrap: wrap; min-inline-size: 0; }
  .prov-cost { display: inline-block; max-inline-size: 100%; color: var(--p); }
  .fig-caption { margin-inline-start: .5rem; color: var(--muted); font-size: .75rem; font-weight: 400; white-space: nowrap; }
  .fig-unit { margin-inline-start: .18em; font: 700 12px/1 var(--mono); color: inherit; vertical-align: baseline; }
  .fig-unit-latin { margin-inline-start: .36em; }
  .fig-prefix { font: 600 12px/1 var(--mono); color: var(--muted); margin-inline-end: .25rem; vertical-align: baseline; }
  .prov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .prov-stats span { display: block; color: var(--muted); font-size: .75rem; }
  .prov-stats b { display: block; font: 700 .75rem/1.4 var(--mono); font-variant-numeric: tabular-nums; }
  .rail { block-size: 10px; display: flex; gap: 2px; }
  .rail i { display: block; min-inline-size: 0; border-radius: 1px; transform-origin: left; }

  .legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; color: var(--muted); font-size: .75rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { inline-size: 10px; block-size: 10px; border-radius: 1px; flex: none; }
  .legend b { color: var(--ink-2); font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Both panes share one alignment: chart centred, caption centred directly
     under it. Previously the heatmap was centred while its legend hugged the
     card's left edge, which read as a misalignment rather than a choice. */
  .activity-split { display: grid; gap: 1.25rem 2rem; grid-template-columns: minmax(22rem, 1.15fr) minmax(18rem, .85fr); align-items: center; }
  .activity-pane { margin: 0; display: grid; grid-template-rows: auto minmax(2rem, auto); align-items: start; justify-items: center; gap: .75rem; }
  .activity-pane .chart-box { max-inline-size: 32rem; min-block-size: 300px; display: grid; place-items: center; }
  #heatmap { overflow-x: hidden; overflow-y: hidden; justify-items: start; scrollbar-width: thin; }
  #heatmap.heat-scroll { overflow-x: auto; }
  #heatmap .chart { inline-size: auto; min-inline-size: 100%; max-inline-size: none; }
  .activity-pane figcaption { justify-content: center; text-align: center; }

  /* ── tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .6rem; }
  .tile { padding: .75rem .85rem; border: 1px solid var(--line); border-radius: var(--r-item); background: var(--card-2); }
  .tile span { display: block; color: var(--muted); font-size: .75rem; }
  .tile .big { display: block; margin-block: .3rem .15rem; color: var(--tint, var(--ink)); }
  .tile em { display: block; color: var(--ink-2); font-size: .75rem; font-style: normal; }

  /* ── ranked rows ── */
  .ranks { display: grid; gap: .6rem; }
  .rank { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(3.5rem, 1.7fr) auto; align-items: center; gap: .6rem; --p: var(--claude); }
  .rank-name { min-inline-size: 0; }
  .rank-name b { display: block; font-size: .75rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-name span { display: block; color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-track { block-size: 10px; border: 1px solid color-mix(in oklab, var(--p) 28%, var(--line)); border-radius: 1px; background: color-mix(in oklab, var(--p) 10%, var(--card-2)); overflow: hidden; }
  .rank-fill { block-size: 100%; border-radius: 0; background: var(--p); transform-origin: left; }
  .rank-val { font: 600 .75rem/1 var(--mono); font-variant-numeric: tabular-nums; text-align: end; }

  /* ── tables ── */
  .scroller { overflow-x: auto; scrollbar-width: thin; border-radius: 0; }
  table { inline-size: 100%; font-size: .75rem; }
  th, td { padding: .5rem .7rem; text-align: end; white-space: nowrap; border-block-end: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: start; }
  thead th { color: var(--muted); font-size: .75rem; font-weight: 600; background: var(--card-2); position: sticky; inset-block-start: 0; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody tr { content-visibility: auto; contain-intrinsic-block-size: auto 2.1lh; }
  tbody tr:hover { background: color-mix(in oklab, var(--claude) 7%, transparent); }
  .tag { display: inline-flex; align-items: center; gap: .35rem; color: var(--ink-2); }
  .tag::before { content: ""; inline-size: 9px; block-size: 9px; border-radius: 1px; background: var(--p); }
  .truncate { max-inline-size: 20rem; overflow: hidden; text-overflow: ellipsis; }

  details { overflow: clip; }
  details + details { margin-block-start: .5rem; }
  summary {
    min-block-size: 48px; display: flex; align-items: center; gap: .55rem; cursor: pointer;
    font-weight: 600; font-size: .75rem; padding-inline: 1rem; background: var(--card-2);
  }
  summary .count { color: var(--muted); font: 500 .75rem/1 var(--mono); }
  summary .chev { margin-inline-start: auto; color: var(--muted); transition: rotate var(--dur) var(--ease-out); }
  details[open] summary .chev { rotate: 90deg; }

  .empty { display: grid; place-items: center; min-block-size: 4rem; padding: .9rem; border-radius: var(--r-item); background: var(--card-2); color: var(--muted); font-size: .75rem; text-align: center; text-wrap: pretty; }
  /* Paired quota cards share a baseline; a filtered single card keeps its natural height. */
  #quota { align-items: stretch; }
  /* What is under the quota row depends only on the row's own height, so the row eases to
     its new height and clips while it does. The margin keeps the cards' offset shadows. */
  #quota { position: relative; overflow: clip; overflow-clip-margin: 6px; }

  footer { margin-block-start: 1.5rem; display: flex; flex-wrap: wrap; gap: .3rem 1rem; color: var(--muted); font-size: .75rem; padding-inline: .3rem; }
  footer .grow { margin-inline-start: auto; overflow-wrap: anywhere; }

  .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hide { display: none !important; }
  .skip { position: fixed; inset-inline-start: 12px; inset-block-start: 10px; z-index: 80; translate: 0 -180%; background: var(--ink); color: var(--canvas); padding: .5rem .8rem; border-radius: var(--r-item); }
  .skip:focus { translate: 0 0; }
}

@layer chart {
  .chart-box { inline-size: 100%; }
  .chart { display: block; inline-size: 100%; block-size: auto; overflow: visible; }
  .gridline { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .axis { fill: var(--muted); font: .75rem var(--mono); font-variant-numeric: tabular-nums; }
  .callout { fill: var(--ink); font: 600 .75rem var(--mono); font-variant-numeric: tabular-nums; }
  .series-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .series-line.draw { stroke-dasharray: none; stroke-dashoffset: 0; }
  .hit { fill: transparent; cursor: crosshair; }
  [data-tip]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .marker { stroke: var(--card); stroke-width: 2.5; }
  .arc-fill { fill: none; stroke-linecap: round; }
  /* polar spokes are wide strokes; a round cap would balloon each one into a
     blob that overlaps its neighbours */
  .spoke { fill: none; stroke-linecap: butt; }
  .cell {
    shape-rendering: crispEdges; stroke: color-mix(in oklab, var(--card) 54%, var(--line)); stroke-width: 1;
    transition: filter var(--dur-fast) var(--ease-out), stroke var(--dur-fast) var(--ease-out), stroke-width var(--dur-fast) var(--ease-out);
  }
  .cell:hover, .cell:focus { filter: brightness(1.08) saturate(1.08); stroke: var(--ink); stroke-width: 2; }
  .cell-off { stroke: var(--line); stroke-dasharray: 2 2; }
  .heat-scale { gap: .25rem !important; }
  .heat-scale i { inline-size: 14px; block-size: 14px; }
  .heat-bounds { color: var(--muted); }
  .heat-bounds b { color: var(--ink-2); }

  #tip {
    position: fixed; z-index: 70; pointer-events: none; opacity: 0;
    padding: .45rem .6rem; border: 1px solid var(--line-2); border-radius: var(--r-card);
    background: var(--card); color: var(--ink); box-shadow: var(--shadow);
    box-sizing: border-box; max-inline-size: min(22rem, calc(100vw - 1rem));
    white-space: pre-line; overflow-wrap: anywhere;
    font: .75rem/1.65 var(--font); font-variant-numeric: tabular-nums;
    transition: opacity var(--dur-fast) var(--ease);
  }

  /* Entrance runs once, when usage is revealed (`#app.intro`); later revisions never
     replay it. Parallel blocks arrive together (Vercel's rule: staggering parallel data
     invents a hierarchy it does not have), so whole sections fade in 20 ms apart, only
     data marks move (bars grow from their baseline, the trend line draws once), and the
     one ordered list cascades at the 20 ms per row Linear uses. */
  #app.intro .usage-block { animation: section-in var(--dur-slow) var(--ease-out) backwards; animation-delay: calc(var(--section-i, 0) * var(--stagger)); }
  #app.intro .rail i, #app.intro .rank-fill { animation: grow-x var(--dur-long) var(--ease-out) backwards; }
  #app.intro .series-area { animation: section-in var(--dur-long) var(--ease-out) backwards; }
  #app.intro .series-line.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line var(--dur-long) var(--ease-out) forwards; }
  #app.intro .marker { animation: section-in var(--dur) var(--ease-out) var(--dur-long) backwards; }
  #app.intro .rank { animation: row-in var(--dur-slow) var(--ease-out) backwards; animation-delay: calc(var(--row-i, 0) * var(--stagger)); }
  /* Quota answers patch the row in place: a meter's blocks fill or drain one after another
     (each block's delay is set by the script, 12 ms apart, in the direction the value
     moves), the same gesture as the beads below them, and its figure turns to the new
     severity colour. */
  #quota .blocks i { transition: background-color var(--dur-fast) var(--ease-out); }
  #quota .meter-pct { transition: color var(--dur) var(--ease-out); }

  @keyframes section-in { from { opacity: 0; } }
  @keyframes row-in { from { opacity: 0; translate: 0 4px; } }
  @keyframes grow-x { from { scale: 0 1; } }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }
  @keyframes live-pulse { 0%, 100% { opacity: .45; scale: .8; } 50% { opacity: 1; scale: 1; } }
  @keyframes port-blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .38; } }
}

@layer utilities {

      grid-template-columns: auto minmax(0, 1fr); justify-items: start; align-items: center;

    .seg button { padding-inline: .6rem; }

    .card-pad { padding-inline: .8rem; }
    .quota-offline { grid-template-columns: auto minmax(0, 1fr); }
    .quota-local-ok { grid-column: 2; }
  }
  /* ── motion: one easing set, one duration scale ──────────────────────────
     Every state change below is a transition (interruptible) rather than a
     keyframe, so a second update mid-flight retargets instead of restarting.
     Nothing here is required to read a value, and the reduced-motion query
     below collapses all of it. */
  /* Motion follows IBM Carbon's productive scale (carbondesignsystem.com/elements/motion):
     standard cubic-bezier(.2,0,.38,.9), entrance cubic-bezier(0,0,.38,.9), and the
     70/110/150/240/400 ms tokens for a bead landing, fades, small movement, expansion
     and the one-time data draw. Carbon's checklist keeps micro-interactions at 90-120 ms
     with ease-out on user input, which is what the segmented pill and the card hover use. */
  :root {
    --ease: cubic-bezier(.2, 0, .38, .9);
    --ease-out: cubic-bezier(0, 0, .38, .9);
    --dur-micro: 70ms;
    --dur-fast: 110ms;
    --dur: 150ms;
    --dur-slow: 240ms;
    --dur-long: 400ms;
    /* Sequencing, not durations: one item after another (Linear's 20 ms), the finer step
       for a meter's 28 blocks, and the caret blinking at the system rate. */
    --stagger: 20ms;
    --stagger-fine: 12ms;
    --caret-blink: 1.06s;
  }

  /* Segmented controls: one pill slides between pressed items, so a filter change
     reads as movement instead of a repaint. Widths are measured in JS because the
     labels differ (Claude / Codex / DeepSeek). */
  .seg { position: relative; }
  .seg::before {
    content: ""; position: absolute; z-index: 0; inset-block: 3px; inset-inline-start: 0;
    inline-size: var(--seg-w, 0px); translate: var(--seg-x, 0px) 0;
    border-radius: var(--r-pill); background: var(--ink); opacity: 0;
    transition: translate var(--dur) var(--ease-out), inline-size var(--dur) var(--ease-out), opacity var(--dur-fast) linear;
  }
  .seg[data-indicator="1"]::before { opacity: 1; }
  .seg button { position: relative; z-index: 1; background: transparent; border-color: transparent; box-shadow: none; }
  .seg button[aria-pressed="true"] { background: transparent; color: var(--card); border-color: transparent; box-shadow: none; transform: none; }
  .seg button[aria-pressed="true"]:active { transform: none; }

  /* Provider cards: the whole card is the toggle for cost <-> tokens. */
  .prov { cursor: pointer; transition: translate var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out); }
  .prov:hover { translate: 0 -2px; box-shadow: 5px 5px 0 color-mix(in oklab, var(--p) 26%, var(--edge) 34%); }
  .prov:active { translate: 0 0; }
  .prov:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }
  .prov-figures { display: grid; min-inline-size: 0; }
  .prov-figures > span { grid-area: 1 / 1; color: var(--p); transition: opacity var(--dur) var(--ease-out), translate var(--dur) var(--ease-out); }
  .prov-tokens { opacity: 0; translate: 0 10px; }
  .prov[data-view="tokens"] .prov-cost { opacity: 0; translate: 0 -10px; }
  .prov[data-view="tokens"] .prov-tokens { opacity: 1; translate: 0 0; }

  .quota-head h3 { margin: 0; font-size: .75rem; font-weight: 700; }
  .quota-note { margin-inline-start: auto; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
  .quota-toggle {
    inline-size: 30px; block-size: 30px; display: grid; place-items: center; flex: none;
    border: 1px solid var(--line-2); border-radius: var(--r-item); background: var(--card); color: var(--ink-2);
    cursor: pointer; transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .quota-toggle:hover { background: var(--card-2); color: var(--ink); border-color: var(--line-2); }
  .quota-toggle svg { transition: rotate var(--dur) var(--ease-out); }
  .quota[data-open="1"] .quota-toggle svg { rotate: 90deg; }
  /* A plan with no metered window says so in one line; the meters fold away. */
  .quota-body {
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur) var(--ease-out);
  }
  .quota[data-open="0"] .quota-body { grid-template-rows: 0fr; opacity: 0; }
  /* Each row sits in its own slot so it can open and close; the slot's inner top padding
     is the row gap, and the clip's negative margin cancels the first one, so the gap never
     jumps when the first row comes or goes. A card clips while it eases to a new height. */
  .quota-clip { min-block-size: 0; overflow: hidden; display: grid; margin-block-start: -.7rem; }
  .q-slot { min-block-size: 0; overflow: clip; }
  .q-in { padding-block-start: .7rem; }
  #quota .quota { overflow: clip; }
  /* Two open quota cards stay equal height; a folded one shrinks to its head. */
  #quota .quota[data-open="0"] { align-self: start; }

  /* Beads: the pegs are punched once, row by row; a bead lands slightly large and settles;
     ironing closes its ring and fuses it with its neighbours. The caret blinks on the
     running step so a long step never looks frozen. */
  .pegs > g { transition: opacity var(--dur-micro) linear; }

    transition: opacity var(--dur-micro) linear, scale var(--dur-fast) var(--ease-out); }
  .bead.on { scale: 1; }
  .bead-body, .bead-hole { transition: r var(--dur) var(--ease); }
  .peg { transition: opacity var(--dur) linear; }
  .wait-status .caret { animation: caret var(--caret-blink) linear infinite; }
  @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Until the first frame is ready the canvas shows alone and nothing transitions, so
     every state lands where it belongs; then the page fades in once. */
  html[data-boot] #app { opacity: 0; }
  html[data-boot] #app *, html[data-boot] #app *::before, html[data-boot] #app *::after { transition: none !important; }
  #app { transition: opacity var(--dur-fast) var(--ease-out); }

  /* Reveal: only the usage slot and the bead boards travel. The root is not captured, so
     the quota above stays live and clickable, and the morph stays within Carbon's 240 ms. */
  :root { view-transition-name: none; }
  ::view-transition { pointer-events: none; }
  ::view-transition-group(*) { animation-duration: var(--dur-slow); animation-timing-function: var(--ease); }
  /* The wait card is taller than the hero it becomes. Clip the slot while it shrinks and
     let the old content leave before the hero arrives (Material's fade-through), so the
     two never print over each other or over the section below. */
  ::view-transition-group(usage-slot) { overflow: clip; overflow-clip-margin: 4px; }
  ::view-transition-old(usage-slot) { animation-duration: var(--dur-micro); }
  ::view-transition-new(usage-slot) { animation-delay: var(--dur-micro); animation-duration: var(--dur); }

  /* Shared micro-motion: a figure the reader re-scoped rises in, disclosures fade their body. */
  @keyframes fig-in { from { opacity: 0; translate: 0 7px; } to { opacity: 1; translate: 0 0; } }
  .is-new { animation: fig-in var(--dur-slow) var(--ease-out); }
  details[open] > *:not(summary) { animation: fade-in var(--dur) var(--ease-out); }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  details > summary svg.chev { transition: rotate var(--dur) var(--ease-out); }
  details[open] > summary svg.chev { rotate: 90deg; }
  .rank-fill { transition: inline-size var(--dur-slow) var(--ease-out); }
  .meter .blocks i { transition: inline-size var(--dur-slow) var(--ease-out); }

  /* The OS preference is a default, not a verdict: the topbar switch writes
     data-motion="full" and the page plays its motion anyway. */
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="full"]) *, html:not([data-motion="full"]) *::before, html:not([data-motion="full"]) *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
  }
  /* The topbar switch can also turn motion off when the OS allows it. */
  html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
  @media (pointer: coarse) { .seg button, .iconbtn { min-block-size: 42px; } }
}

<script>
/* Both pixel faces start loading now, side by side. Otherwise Fusion is requested only after
   Ark has loaded and a glyph Ark lacks asks for it, and regular text lands after bold text.
   A preload link would do the same on file://, but its CORS mode is easy to get wrong. */
if (document.fonts && typeof document.fonts.load === "function") {
  ['12px "Ark Pixel 12px"', '12px "Fusion Pixel 12px"'].forEach(function (font) { document.fonts.load(font).catch(function () {}); });
}

<script>
addEventListener("error", function (event) {
  // Chromium reports a ResizeObserver delivery loop as an error event even though the
  // page is fine; treating it as a boot failure would replace a working dashboard with
  // "页面加载失败". Every other error is still fatal here.
  if (String(event.message || "").indexOf("ResizeObserver loop") === 0) return;
  window.__BOOT_ERROR__ = {
    message: event.message || "unknown",
    line: event.lineno || 0,
    column: event.colno || 0
  };
  var message = document.getElementById("bootMessage");
  if (message) message.textContent = "页面加载失败，请重新启动";
  // A failing page script must not leave the first frame waiting for it.
  try { if (typeof window.__show__ === "function") window.__show__(); }
  finally { delete document.documentElement.dataset.boot; }
});
(function () {
  "use strict";

  var data = null, filter = "all", period = "30days", charts = [], terminalFailure = false, stalled = false, pageShown = false;
  var lastRunId = null, lastRevision = -1, lastRevisionAt = Date.now(), desiredPeriod = null;
  var PERIOD_LABEL = { today: "今天", week: "近 7 天", "30days": "近 30 天", month: "本月", all: "全部", lifetime: "全部" };

  // Remembered UI state, next to the theme key: which quota card the reader folded
  // away and whether a provider card shows cost or tokens. A relaunch opens the page
  // the way it was left instead of guessing again.
  var PREF_KEY = "ai-usage-ledger-prefs";
  var prefs = (function () {
    var parsed = null;
    try {
      var raw = localStorage.getItem(PREF_KEY);
      parsed = raw ? JSON.parse(raw) : null;
    } catch (e) {}
    function plain(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
    if (!plain(parsed)) return {};
    // Every file:// page shares this store, so an older build or any other local page may
    // have written it: nested maps that are not plain objects are dropped and rebuilt on
    // the next write, instead of throwing on the first property assignment.
    ["quota", "view", "lastQuota", "quotaShape"].forEach(function (key) {
      if (parsed[key] != null && !plain(parsed[key])) delete parsed[key];
    });
    if (parsed.lastProviders != null && !(Array.isArray(parsed.lastProviders) &&
        parsed.lastProviders.every(function (p) { return typeof p === "string"; }))) delete parsed.lastProviders;
    return parsed;
  })();
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
  }

  function $(id) { return document.getElementById(id); }

  window.__fail__ = function () {
    var failure = window.__GENERATION_FAILURE__ || {};
    if (["initial_generation_failed", "partial_generation_failed"].indexOf(failure.reason) < 0 ||
        ["startup", "default_usage", "remaining_usage", "local_limits", "claude_quota", "codex_quota", "final_publish"].indexOf(failure.stage) < 0 ||
        typeof failure.runId !== "string" || !failure.runId || failure.runId.length > 128 ||
        typeof failure.generatedAt !== "string" || !isFinite(Date.parse(failure.generatedAt))) return;
    if (data && String(failure.runId || "") !== String(data.runId || "")) return;
    if (!data && failure.reason !== "initial_generation_failed") return;
    terminalFailure = true;
    if (data) {
      renderQuota();
      var stamp = $("stamp");
      if (!stamp.textContent.includes("数据生成失败")) {
        stamp.textContent = stamp.textContent.replace(" · 更新中", " · 数据生成失败，请重新启动");
      }
      if (usageReady()) revealUsage();
      else waitFailed("本地用量读取失败，请重新启动");

  function fitHeroFigure() {
    var host = $("heroFigure"), text = window.__heroFigureText || "$0.00";
    var available = Math.max(120, Math.floor(host.parentElement.clientWidth || 0)) - figurePrefixReserve(text);
    var px = Math.max(3, Math.min(7, Math.floor((available - 2) / Math.max(1, figureWidth(text)))));
    host.innerHTML = figure(text, px, "var(--claude)");
  }
  function fitProviderFigures() {
    // Cost and tokens are independent scales: each view sizes from its own widest
    // figure, so changing the token unit (K/M/B -> 精确) cannot shrink the cost.
    var cards = Array.prototype.slice.call(document.querySelectorAll(".prov"));
    if (!cards.length) return;
    var rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var captionReserve = Math.round(96 * rootPx / 16);
    var buckets = { cost: { maxWidth: 0, minAvailable: Infinity }, tokens: { maxWidth: 0, minAvailable: Infinity } };
    var items = cards.map(function (card) {
      var row = card.querySelector(".prov-cost-row");
      var available = Math.max(96, (row ? row.clientWidth : card.clientWidth) - captionReserve);
      var hosts = {};
      ["cost", "tokens"].forEach(function (view) {
        var host = card.querySelector(".prov-" + view);
        if (!host) return;
        hosts[view] = host;
        var hostAvailable = available - figurePrefixReserve(host.dataset.figureText || "");
        buckets[view].minAvailable = Math.min(buckets[view].minAvailable, hostAvailable);
        buckets[view].maxWidth = Math.max(buckets[view].maxWidth, figureWidth(host.dataset.figureText || ""));
      });
      return hosts;
    });
    var px = {
      cost: Math.max(2, Math.min(5, Math.floor((buckets.cost.minAvailable - 2) / Math.max(1, buckets.cost.maxWidth)))),
      tokens: Math.max(2, Math.min(5, Math.floor((buckets.tokens.minAvailable - 2) / Math.max(1, buckets.tokens.maxWidth))))
    };
    items.forEach(function (hosts) {
      ["cost", "tokens"].forEach(function (view) {
        var host = hosts[view];
        if (!host) return;
        var text = host.dataset.figureText || "";
        if (!text) { host.innerHTML = ""; return; }
        var caption = host.dataset.figureCaption || "";
        host.innerHTML = figure(text, px[view], getComputedStyle(host).color, host.dataset.figureUnit || "") +
          (caption ? '<span class="fig-caption">' + esc(caption) + "</span>" : "");
      });
    });
  }
  function fitTileFigures() {
    // Tiles are narrow, so fit the widest figure to the tile's content box and
    // clamp; a wide $123,456.78 must not spill into the next tile.
    Array.prototype.slice.call(document.querySelectorAll("#activityTiles .tile .big")).forEach(function (host) {
      var text = host.dataset.figureText || "";
      if (!text) { host.innerHTML = ""; return; }
      var available = Math.max(2, host.clientWidth || 0);
      var px = Math.max(2, Math.min(4, Math.floor((available - 2) / Math.max(1, figureWidth(text)))));
      host.innerHTML = figure(text, px, host.parentElement.style.getPropertyValue("--tint") || "var(--ink)");
    });
  }

  /* ──────────────────── ⑤ 活跃度与时段（同一张卡） ── */
  function renderActivity() {
    var rows = dailyRows(), host = $("heatmap");
    if (!rows.length) {
      host.innerHTML = '<p class="empty">当前周期暂无每日数据</p>';
      host.classList.remove("heat-scroll");
      $("activityTiles").innerHTML = ""; $("heatLegend").innerHTML = ""; $("heatRange").textContent = "";
      $("hoursWrap").classList.add("hide");
      return;
    }

    var byDate = {};
    rows.forEach(function (r) { byDate[r.date] = rowTotal(r); });
    var first = new Date(rows[0].date + "T00:00:00"), last = new Date(rows[rows.length - 1].date + "T00:00:00");
    var days = [];
    for (var d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      days.push({ date: key, value: n(byDate[key]), dow: d.getDay() });
    }
    if (!days.length) {
      host.innerHTML = '<p class="empty">当前周期暂无每日数据</p>';
      host.classList.remove("heat-scroll");
      $("activityTiles").innerHTML = ""; $("heatLegend").innerHTML = ""; $("heatRange").textContent = "";
      $("hoursWrap").classList.add("hide");
      return;
    }
    var active = days.filter(function (x) { return x.value > 0; });
    var peak = days.reduce(function (a, b) { return b.value > a.value ? b : a; }, days[0]);
    var best = 0, run = 0, current = 0;
    days.forEach(function (x) { run = x.value > 0 ? run + 1 : 0; best = Math.max(best, run); });
    for (var i = days.length - 1; i >= 0 && days[i].value > 0; i--) current++;

    $("heatRange").textContent = days[0].date + " → " + days[days.length - 1].date;
    $("activityTiles").innerHTML = [
      ["活跃天数", int(active.length), days.length + " 天内", "var(--c3)"],
      ["当前连续", int(current) + " 天", current ? "持续中" : "已中断", "var(--c1)"],
      ["最长连续", int(best) + " 天", "本周期", "var(--c4)"],
      ["单日峰值", money(peak.value), peak.date, "var(--claude)"]
    ].map(function (t) {
      return '<article class="tile" style="--tint:' + t[3] + '"><span>' + t[0] + "</span>" +
        '<span class="big" data-figure-text="' + esc(String(t[1])) + '"></span><em>' + esc(t[2]) + "</em></article>";
    }).join("");

    var sorted = active.map(function (x) { return x.value; }).sort(function (a, b) { return a - b; });
    function quantile(values, q) {
      if (!values.length) return 0;
      var pos = (values.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
      if (lo === hi) return values[lo];
      return values[lo] + (values[hi] - values[lo]) * (pos - lo);
    }
    var scaleLow = quantile(sorted, .1);
    var scaleHigh = quantile(sorted, .9);
    var logLow = Math.log1p(scaleLow), logSpan = Math.log1p(scaleHigh) - logLow;
    function stepOf(v) {
      if (v <= 0) return -1;
      if (sorted.length === 1) return 4;
      if (logSpan <= .000001) return 2;
      var score = (Math.log1p(v) - logLow) / logSpan;
      return Math.max(0, Math.min(4, Math.floor(score * 5)));
    }

    register(host, function (w) {
      var weeks = Math.ceil((days[0].dow + days.length) / 7), gap = 4;
      var cell = Math.max(12, Math.min(28, Math.floor((w - 32 - (weeks - 1) * gap) / weeks)));
      var top = 22, gridW = weeks * (cell + gap) - gap;
      var chartWidth = Math.max(w, gridW + 52);
      host.classList.toggle("heat-scroll", chartWidth > w + 1);
      var left = chartWidth > w ? 26 : Math.max(26, Math.round((chartWidth - gridW) / 2));
      var h = top + 7 * (cell + gap);
      var s = svgOpen(chartWidth, h, "每日用量日历热力图", true);
      ["一", "三", "五"].forEach(function (lbl, k) {
        s += '<text class="axis" x="' + (left - 22) + '" y="' + (top + (k * 2 + 1) * (cell + gap) + cell * 0.72) + '">' + lbl + "</text>";
      });
      var lastMonth = "";
      days.forEach(function (x, idx) {
        var col = Math.floor((days[0].dow + idx) / 7);
        var cx = left + col * (cell + gap), cy = top + x.dow * (cell + gap);
        var st = stepOf(x.value);
        s += '<rect class="cell' + (st < 0 ? ' cell-off' : '') + '" style="animation-delay:' + Math.min(idx, 40) * 12 + 'ms" rx="1" x="' + cx + '" y="' + cy + '" width="' + cell + '" height="' + cell +
          '" fill="' + (st < 0 ? "var(--card-2)" : RAMP[st]) + '" data-tip="' + esc(x.date) + "&#10;" +
          (x.value > 0 ? money(x.value) + "&#10;强度 " + (st + 1) + "/5" : "无用量") + '"/>';
        var month = x.date.slice(5, 7);
        if (month !== lastMonth && x.dow <= 1) { lastMonth = month; s += '<text class="axis" x="' + cx + '" y="13">' + Number(month) + "月</text>"; }
      });
      return s + "</svg>";
    });
    ro.observe(host);

    $("heatLegend").innerHTML =
      '<span><i style="background:var(--card-2);border:1px dashed var(--line-2)"></i>无用量</span>' +
      '<span class="heat-scale">低' + RAMP.map(function (c, i) { return '<i style="background:' + c + '" data-tip="强度 ' + (i + 1) + '/5"></i>'; }).join("") + "高</span>" +
      (sorted.length ? '<span class="heat-bounds">对数色阶 <b>' + money(scaleLow) + '</b>–<b>' + money(scaleHigh) + '</b></span>' : '');

    renderHours(rows);
    fitTileFigures();
  }

  function renderHours(rows) {
    var wrap = $("hoursWrap"), host = $("hoursChart");
    var blocks = claudeBlocks();
    if ((filter !== "all" && filter !== "claude") || !blocks || !blocks.length || convertUsd(1) == null) { wrap.classList.add("hide"); return; }

    var from = new Date(rows[0].date + "T00:00:00").getTime();
    var to = new Date(rows[rows.length - 1].date + "T23:59:59").getTime();
    var hours = new Array(24).fill(0), used = 0, unpriced = false;
    blocks.forEach(function (b) {
      if (b.isGap || !b.startTime) return;
      var s = new Date(b.startTime).getTime(), e = new Date(b.actualEndTime || b.endTime).getTime();
      if (!(e > s) || e < from || s > to) return;
      used++;
      if ((b.costUSD === 0 && b.totalTokens > 0) || b.costIncomplete === true) unpriced = true;
      var span = e - s, c = n(convertUsd(b.costUSD));
      for (var t = s; t < e; ) {                     // spread across the hours it actually spanned
        var slot = new Date(t), next = new Date(slot);
        next.setMinutes(0, 0, 0); next.setHours(next.getHours() + 1);
        var chunk = Math.min(next.getTime(), e) - t;
        hours[slot.getHours()] += c * (chunk / span);
        t += chunk;
      }
    });
    // A cost profile with unpriced windows, or with no cost at all, has no true peak.
    if (!used || unpriced || !(Math.max.apply(null, hours) > 0)) { wrap.classList.add("hide"); return; }
    wrap.classList.remove("hide");

    var max = Math.max.apply(null, hours.concat([0.01]));
    var peakHour = hours.indexOf(Math.max.apply(null, hours));
    $("hoursCap").textContent = "Claude · 峰值 " + peakHour + ":00";

    register(host, function (w) {
      var size = Math.min(w, 300), c = size / 2, rMax = c - 32, rMin = 22;
      var s = svgOpen(w, size, "Claude 24 小时用量分布");
      var ox = (w - size) / 2 + c;
      [0.5, 1].forEach(function (f) {
        s += '<circle class="gridline" fill="none" cx="' + ox + '" cy="' + c + '" r="' + (rMin + (rMax - rMin) * f) + '"/>';
      });
      hours.forEach(function (v, hr) {
        var a0 = (hr / 24) * Math.PI * 2 - Math.PI / 2 + 0.018;
        var a1 = ((hr + 1) / 24) * Math.PI * 2 - Math.PI / 2 - 0.018;
        var len = rMin + (rMax - rMin) * (v / max);
        var isPeak = hr === peakHour;
        s += '<path class="spoke" d="' + arc(ox, c, (rMin + len) / 2, a0, a1) + '" stroke="' +
          (isPeak ? "var(--c2)" : "var(--claude)") + '" stroke-width="' + Math.max(1, len - rMin) +
          '" opacity="' + (isPeak ? 1 : 0.62) + '" data-tip="' + hr + ":00-" + ((hr + 1) % 24) + ':00&#10;' + money(v) + '"/>';
      });
      [0, 6, 12, 18].forEach(function (hr) {
        var a = (hr / 24) * Math.PI * 2 - Math.PI / 2;
        s += '<text class="axis" x="' + (ox + Math.cos(a) * (rMax + 12)).toFixed(1) + '" y="' + (c + Math.sin(a) * (rMax + 12) + 3.5).toFixed(1) +
          '" text-anchor="middle">' + hr + "时</text>";
      });
      return s + "</svg>";
    });
    ro.observe(host);
  }

  /* ─────────────────────────── ⑥ 模型构成 · 环形 ── */
  function modelSlotMap() {
    // colour follows the model, not its rank in the current filter, so filtering
    // never repaints the survivors
    var all = {};
    providerList().forEach(function (p) {
      list(report(p).models).forEach(function (m) {
        if (m.kind === "unattributed") return;
        all[m.name] = (all[m.name] || 0) + n(m.cost);
      });
    });
    var map = {};
    Object.keys(all).sort(function (a, b) { return all[b] - all[a]; })
      .forEach(function (name, i) { map[name] = i < 6 ? SLOTS[i] : "var(--c-rest)"; });
    return map;
  }
  function collect(key) {
    var out = [];
    shown().forEach(function (p) { list(report(p)[key]).forEach(function (item) { out.push({ p: p, item: item }); }); });
    return out.sort(function (a, b) { return n(b.item.cost) - n(a.item.cost); });
  }

  function renderModels() {
    var models = collect("models"), host = $("modelDonut");
    var unattributed = models.filter(function (x) { return x.item.kind === "unattributed"; });
    var namedCount = models.length - unattributed.length;
    $("modelTotal").textContent = namedCount + " 个模型" + (unattributed.length ? " · 含未归属" : "");
    if (!models.length) { host.innerHTML = '<p class="empty">当前筛选暂无模型数据</p>'; $("modelLegend").innerHTML = ""; return; }
    var slots = modelSlotMap();

      el.sizing.onfinish = settleOn(el);
    });
    // A row that goes fades before its slot is fully shut, so it is never seen squeezed.
    fx.leave.forEach(function (slot) {
      var from = before.get(slot) || { h: slot.getBoundingClientRect().height, o: 1 };
      slot.fading = slot.animate({ opacity: [from.o, 0] }, { duration: fx.fast, easing: easeOut, fill: "forwards" });
      slot.sizing = slot.animate({ blockSize: [from.h + "px", "0px"] }, { duration: fx.slow, easing: ease, fill: "forwards" });
      slot.sizing.onfinish = function () { slot.remove(); };
    });
    // A card that goes stays where it was, out of the row's flow, and fades; one that arrives
    // fades in at its place, so a swap reads as one card changing, not one closing and
    // another opening with the page bouncing between them.
    var origin = after.get(host);
    fx.gone.forEach(function (card) {
      var from = before.get(card);
      card.style.position = "absolute";
      card.style.insetBlockStart = from.top - origin.top + "px";
      card.style.insetInlineStart = from.left - origin.left + "px";
      card.style.inlineSize = from.w + "px";
      card.style.blockSize = from.h + "px";
      card.sizing = card.animate({ opacity: [from.o, 0] }, { duration: fx.fast, easing: easeOut, fill: "forwards" });
      card.sizing.onfinish = function () { card.remove(); };
    });
    fresh.forEach(function (card) { card.animate({ opacity: [0, 1] }, { duration: fx.fast, easing: easeOut }); });
    fx.faded.forEach(function (el) {
      var inside = fresh.concat(fx.enter, fx.faded).some(function (owner) { return owner !== el && owner.contains(el); });
      if (!inside && el.isConnected) el.animate({ opacity: [0, 1] }, { duration: fx.fast, easing: easeOut });
    });
    var curve = easing("--ease");
    fx.counts.forEach(function (count) {
      var start = performance.now();
      (function step(now) {
        var t = Math.min(1, Math.max(0, (now - start) / count.ms));
        count.el.textContent = t < 1 ? Math.round(count.from + (count.to - count.from) * curve(t)) + count.suffix : count.text;
        count.el.countFrame = t < 1 ? requestAnimationFrame(step) : 0;
      })(start);
    });
    rememberQuotaShapeSoon();
  }

  function pulse(node) {
    // With reduced motion its 0.01 ms fade would only blank the figure for a frame.
    if (!node || !motionEffective()) return;
    node.classList.remove("is-new");
    void node.offsetWidth;
    node.classList.add("is-new");
  }

  // Quota fold: delegated, so a re-render never drops the handler.
  $("quota").addEventListener("click", function (event) {
    var button = event.target.closest && event.target.closest(".quota-toggle");
    if (!button) return;
    var card = button.closest(".quota");
    var open = card.dataset.open !== "1";
    // The fold owns the card's height from here: no remembered box, no answer's easing.
    if (card.sizing) { card.sizing.cancel(); card.sizing = null; }
    card.style.blockSize = "";
    card.dataset.open = open ? "1" : "0";
    button.setAttribute("aria-expanded", String(open));
    prefs.quota = prefs.quota || {};
    prefs.quota[card.dataset.q] = open ? "open" : "closed";
    savePrefs();
    // The next launch's placeholder takes the folded or opened box, once the fold settles.
    rememberQuotaShapeSoon();
  });
  // A page closed right after an answer still leaves the next launch its box.
  addEventListener("pagehide", function () { if (!quotaBusy()) rememberQuotaShape(); });

  function toggleProviderView(card) {
    var next = card.dataset.view === "tokens" ? "cost" : "tokens";
    card.dataset.view = next;
    card.setAttribute("aria-pressed", String(next === "tokens"));
    prefs.view = prefs.view || {};
    prefs.view[card.dataset.p] = next;
    savePrefs();
  }
  $("split").addEventListener("click", function (event) {
    var card = event.target.closest && event.target.closest(".prov");
    if (card) toggleProviderView(card);
  });
  $("split").addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
    var card = event.target.closest && event.target.closest(".prov");
    if (!card) return;
    event.preventDefault();
    toggleProviderView(card);
  });

  /* ─────────────────────────────────── wiring ── */
  function syncPressed(nodes, isOn) { nodes.forEach(function (b) { b.setAttribute("aria-pressed", String(isOn(b))); }); }
  function renderStamp() {
    if (!data) return;
    var stamp = $("stamp"), text = "生成于 " + stampAt(data.generatedAt) + " · " + (PERIOD_LABEL[period] || period) +
      (data.generationError ? " · 部分更新失败，请重新启动" : data.complete === false ? " · 更新中" : " · 更新完成");
    if (stamp.textContent === text) return;
    stamp.textContent = text;
    // A new status fades in like any other changed text.
    if (pageShown && motionEffective() && !document.hidden) {
      stamp.animate({ opacity: [0, 1] }, { duration: motionMs("--dur-fast"), easing: motionToken("--ease-out") });
    }
  }

  /* The selector is a local re-expression of the same snapshot: the configured
     currency leads, every other published rate follows, and no rate table means
     the control stays hidden. */
  function renderCurrency() {
    var select = $("currencySel");
    if (!select) return;
    var fx = data && data.fx;
    var rates = fx && fx.rates && typeof fx.rates === "object" ? fx.rates : {};
    var codes = Object.keys(rates).filter(function (c) { return /^[A-Z]{3}$/.test(c); });
    if (codes.indexOf("USD") < 0) codes.push("USD");
    codes = codes.filter(function (c, i) { return codes.indexOf(c) === i; });
    var own = String(currencyInfo().code || "USD").toUpperCase();
    var shown = shownCurrency();
    if (codes.indexOf(shown) < 0) shown = codes.indexOf(own) >= 0 ? own : codes[0];
    codes.sort(function (a, b) {
      if (a === own) return -1;
      if (b === own) return 1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    var signature = codes.join("|") + ">" + shown;
    select.hidden = codes.length < 2;
    select.disabled = false;
    // Remembered so the next launch can hold the switch's place before its first snapshot.
    if (Boolean(prefs.fxShown) !== !select.hidden) { prefs.fxShown = !select.hidden; savePrefs(); }
    if (select.dataset.sig === signature) return;
    select.dataset.sig = signature;
    if (codes.length < 2) { select.textContent = ""; return; }
    select.innerHTML = codes.map(function (c) {
      return '<option value="' + c + '"' + (c === shown ? " selected" : "") + ">" + c + "</option>";
    }).join("");
  }

  function syncSeg(seg) {
    var pressed = seg.querySelector('button[aria-pressed="true"]');
    if (!pressed) { seg.dataset.indicator = "0"; return; }
    seg.style.setProperty("--seg-x", pressed.offsetLeft + "px");
    seg.style.setProperty("--seg-w", pressed.offsetWidth + "px");
    seg.dataset.indicator = "1";
  }
  function syncSegs() {
    document.querySelectorAll(".seg").forEach(syncSeg);
  }

  // Patched in place: the planned buttons from the first frame stay, and a period simply
  // brightens when its report lands. Only a different plan rebuilds the row.
  function buildPeriodSeg() {
    var seg = $("periodSeg");
    var focusedPeriod = document.activeElement && document.activeElement.dataset
      ? document.activeElement.dataset.period : null;
    var ready = data.periods && data.periods.length ? data.periods : [];
    // The switcher keeps the run's planned shape from the first revision and simply
    // enables a period when its report lands. Showing only ready keys made it collapse
    // to a single button on first paint, then jump 3 -> 1 -> 2 -> 3 as reports arrived.
    var planned = data.plannedPeriods && data.plannedPeriods.length
      ? data.plannedPeriods
      : (ready.length ? ready : [data.period]);
    var keys = planned.slice();
    if (desiredPeriod && ready.indexOf(desiredPeriod) >= 0) period = desiredPeriod;
    if (ready.length && ready.indexOf(period) < 0) {
      period = ready.indexOf(data.period) >= 0 ? data.period : ready[0];
    }
    var buttons = Array.from(seg.querySelectorAll("[data-period]"));
    var rebuilt = buttons.length !== keys.length || buttons.some(function (b, i) { return b.dataset.period !== keys[i]; });
    if (rebuilt) {
      seg.innerHTML = keys.map(function (k) {
        return '<button type="button" data-period="' + esc(k) + '">' + esc(PERIOD_LABEL[k] || k) + "</button>";
      }).join("");
    }
    seg.querySelectorAll("[data-period]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.period === period));
      b.disabled = ready.indexOf(b.dataset.period) < 0;
    });
    syncSeg(seg);
    if (rebuilt && focusedPeriod) {
      var replacement = Array.from(seg.querySelectorAll("[data-period]")).filter(function (b) {
        return b.dataset.period === focusedPeriod;
      })[0];
      if (replacement) replacement.focus({ preventScroll: true });
    }
  }
  // Delegated, so the buttons from the first frame work as soon as their report lands.
  $("periodSeg").addEventListener("click", function (event) {
    var b = event.target.closest && event.target.closest("[data-period]");
    if (!b || b.disabled || !data) return;
    desiredPeriod = b.dataset.period;
    period = b.dataset.period;
    syncPressed(Array.from($("periodSeg").querySelectorAll("[data-period]")), function (x) { return x === b; });
    syncSeg($("periodSeg")); syncUrl(); renderStamp(); render();
  });
  function syncUrl() {
    var url = new URL(location.href);
    filter === "all" ? url.searchParams.delete("provider") : url.searchParams.set("provider", filter);
    period === (data && data.period) ? url.searchParams.delete("period") : url.searchParams.set("period", period);
    history.replaceState(null, "", url);
  }

  document.querySelectorAll("[data-filter]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.filter;
      syncPressed(Array.from(document.querySelectorAll("[data-filter]")), function (x) { return x === b; });
      syncUrl(); render();
    });
  });

  var chartBtn = $("trendChartBtn"), tableBtn = $("trendTableBtn");
  function trendView(asTable) {
    $("trendChart").classList.toggle("hide", asTable);
    $("trendTable").classList.toggle("hide", !asTable);
    chartBtn.setAttribute("aria-pressed", String(!asTable));
    tableBtn.setAttribute("aria-pressed", String(asTable));
    if (!asTable) repaintAll();
  }
  chartBtn.addEventListener("click", function () { trendView(false); });
  tableBtn.addEventListener("click", function () { trendView(true); });

  /* two-state theme: system default ⇄ pinned opposite */
  var meta = document.querySelector('meta[name="color-scheme"]');
  var mq = matchMedia("(prefers-color-scheme: dark)");
  function isDark() { var pin = document.documentElement.dataset.cs; return pin ? pin === "dark" : mq.matches; }
  function syncTheme() {
    var dark = isDark(), button = $("themeBtn");
    var label = dark ? "切换到浅色主题" : "切换到深色主题";
    button.setAttribute("aria-pressed", String(dark));
    button.setAttribute("aria-label", label);
    button.querySelector(".sr-only").textContent = label;
    button.dataset.tip = label;
    $("themeColor").setAttribute("content", dark ? "#11140f" : "#ecebe6");
  }
  mq.addEventListener("change", function () { syncTheme(); repaintAll(); });
  $("currencySel").addEventListener("change", function () {
    prefs.currency = $("currencySel").value;
    savePrefs();
    render();
  });
  $("themeBtn").addEventListener("click", function () {
    if (document.documentElement.dataset.cs) {
      delete document.documentElement.dataset.cs;
      meta.content = "light dark";
      try { localStorage.removeItem("ai-usage-ledger-theme"); } catch (e) {}
    } else {
      var next = mq.matches ? "light" : "dark";
      document.documentElement.dataset.cs = next;
      meta.content = next;
      try { localStorage.setItem("ai-usage-ledger-theme", next); } catch (e) {}
    }
    syncTheme(); repaintAll();
  });
  syncTheme();

  /* Motion is an effective two-state switch, not a "force full" override. The OS
     preference is only the starting point; the button shows the state it will
     actually produce, and an explicit choice is stored only while it differs from
     the OS. That makes the button meaningful whether the OS allows motion or not. */
  var motionKey = "ai-usage-ledger-motion";
  var mqMotion = matchMedia("(prefers-reduced-motion: reduce)");
  function motionEffective() {
    var state = document.documentElement.dataset.motion;
    if (state === "full") return true;
    if (state === "off") return false;
    return !mqMotion.matches;
  }
  function syncMotion() {
    var full = motionEffective(), button = $("motionBtn");
    button.setAttribute("aria-pressed", String(full));
    button.setAttribute("aria-label", "动效");
    button.dataset.tip = full ? "动效已开启，点击关闭" : "动效已关闭，点击开启";
    button.querySelector(".sr-only").textContent = "动效";
  }
  mqMotion.addEventListener("change", syncMotion);
  $("motionBtn").addEventListener("click", function () {
    var next = !motionEffective();
    if (next === !mqMotion.matches) {
      // Back to following the OS: drop the override instead of storing a duplicate.
      delete document.documentElement.dataset.motion;
      try { localStorage.removeItem(motionKey); } catch (e) {}
    } else {
      document.documentElement.dataset.motion = next ? "full" : "off";
      try { localStorage.setItem(motionKey, next ? "full" : "off"); } catch (e) {}
    }
    syncMotion();
  });
  syncMotion();
  initTipTips();
  function syncUnitSeg() {
    var seg = $("unitSeg");
    if (!seg) return;
    var current = tokenUnit();
    seg.querySelectorAll("button[data-unit]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.unit === current));
    });
    syncSeg(seg);
  }
  $("unitSeg").addEventListener("click", function (event) {
    var button = event.target && event.target.closest ? event.target.closest("button[data-unit]") : null;
    if (!button) return;
    prefs.tokenUnit = button.dataset.unit;
    savePrefs();
    syncUnitSeg();
    if (data) renderUsage(true);
  });
  syncUnitSeg();

  var q = new URLSearchParams(location.search);
  if (["all", "claude", "codex", "deepseek"].indexOf(q.get("provider")) >= 0) filter = q.get("provider");
  desiredPeriod = q.get("period") || null;
  if (desiredPeriod) period = desiredPeriod;
  syncPressed(Array.from(document.querySelectorAll("[data-filter]")), function (b) { return b.dataset.filter === filter; });
  $("wordmark").innerHTML = pixel("AI USAGE", 3, "currentColor");

  addEventListener("resize", function () {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(function () { fitHeroFigure(); fitProviderFigures(); fitTileFigures(); syncSegs(); repaintAll(); }, 150);
  });

  /* ─────────────────────────── data intake ── */
  window.__render__ = function () {
    var incoming = window.__DATA__ || {};
    var runId = String(incoming.runId || "legacy");
    var revision = Number(incoming.revision);
    if (!isFinite(revision)) revision = 0;
    if (runId === lastRunId && revision <= lastRevision) return;
    var runChanged = lastRunId != null && runId !== lastRunId;
    var firstRender = !data;
    var previousData = runChanged ? null : data;
    var previousPeriod = period;
    var previousReport = previousData && previousData.reports ? previousData.reports[previousPeriod] : null;
    var previousLimits = previousData ? previousData.limits : null;
    var previousCurrency = previousData ? previousData.currency : null;
    var previousPeriods = previousData && previousData.periods ? previousData.periods.join("|") : "";
    data = incoming;
    lastRunId = runId;
    lastRevision = revision;
    lastRevisionAt = Date.now();
    if ((firstRender || runChanged) && data.period && !desiredPeriod) period = data.period;
    var nextPeriods = data.periods ? data.periods.join("|") : "";
    if (firstRender || previousPeriods !== nextPeriods) buildPeriodSeg();
    renderStamp();
    renderCurrency();
    $("source").textContent = (data.source && data.source.name ? data.source.name : "本地统计") + (data.source && data.source.version ? " " + data.source.version : "");
    $("location").textContent = data.appDir || "";
    // A new run that already has usage keeps the page as it is; one that does not yet
    // waits again in the usage slot, from fresh boards.
    if (runChanged && !usageReady()) beadReset();
    beadSync();
    // Every revision, not only the first: the filter row must follow the boards.
    var filterFellBack = syncProviderFilter();
    if (firstRender) {
      render();
    } else {
      var currencyChanged = JSON.stringify(previousCurrency) !== JSON.stringify(data.currency);
      var nextReport = data.reports ? data.reports[period] : null;
      var wasPending = $("app").classList.contains("usage-pending");
      // ccusage can finish after the first usage revision; its blocks feed the hour chart.
      var blocksChanged = JSON.stringify(previousLimits && previousLimits.claudeBlocks) !==
        JSON.stringify(data.limits && data.limits.claudeBlocks);
      // Shown usage with no readable report behind it goes back to waiting on the next
      // revision instead of staying on figures from another run.
      var usageChanged = currencyChanged || previousPeriod !== period || wasPending || blocksChanged ||
        filterFellBack || (!wasPending && !usageReady()) || JSON.stringify(previousReport) !== JSON.stringify(nextReport);
      // The window row's placeholder depends on the run's state, not only on its limits.
      var runStateChanged = !previousData || previousData.complete !== data.complete ||
        !previousData.generationError !== !data.generationError;
      if (currencyChanged || runStateChanged || filterFellBack || (wasPending && usageReady()) ||
          JSON.stringify(previousLimits) !== JSON.stringify(data.limits)) renderQuota();
      if (usageChanged) syncUsage();
    }
  };

  var attempts = 0, bootStartedAt = Date.now();
  function continuePolling() {
    if (terminalFailure) return;
    var waitStartedAt = data ? lastRevisionAt : bootStartedAt;
    if (Date.now() - waitStartedAt < 600000) {
      setTimeout(load, 500);
    } else if (data) {
      stalled = true;
      renderQuota();
      $("stamp").textContent = $("stamp").textContent.replace(" · 更新中", " · 更新未完成，请重新启动");
      if (usageReady()) revealUsage();
      else if (!usageRevealed) waitFailed("用量汇总未完成，请重新启动");
    } else {
      $("stamp").textContent = "数据生成超时";
      bootQuota("未读取");
      waitFailed("数据生成超时，请重新启动");
    }
  }
  function probeFailure() {
    if (terminalFailure) return;
    var failureScript = document.createElement("script");
    failureScript.src = "failure.js?t=" + Date.now();
    failureScript.onload = function () {
      failureScript.remove();
      continuePolling();
    };
    failureScript.onerror = function () {
      failureScript.remove();
      continuePolling();
    };
    document.body.appendChild(failureScript);
  }
  function load() {
    var script = document.createElement("script");
    script.src = "data.js?t=" + Date.now();
    script.onload = function () {
      script.remove();
      attempts = 0;
      readSettled();
      if (terminalFailure) return;
      if (!data || data.complete === false) probeFailure();
    };
    script.onerror = function () {
      script.remove();
      readSettled();
      if (terminalFailure) return;
      attempts += 1;
      probeFailure();
    };
    document.body.appendChild(script);
  }

  // The first painted frame is the page as it stays. The canvas shows alone until the
  // pixel fonts are in and the first data read has settled; then the shell, with whatever
  // answer was already there, fades in once. Text never lands after its box, the pill
  // never slides to a re-measured width, and a page reopened on finished data shows its
  // usage at once instead of a wait card that leaves straight away. The head script
  // calls window.__show__ at its cap, so a page that cannot get its fonts shows anyway.
  var fontsIn = false, firstRead = false;
  // A task of its own: a failure while showing the page must not stop the polling that follows.
  function readSettled() { if (!firstRead) { firstRead = true; if (fontsIn) setTimeout(showPage); } }
  function showPage() {
    if (pageShown) return;
    pageShown = true;
    try {
      syncSegs();
      if (!data) holdQuotaBoxes();
      // Everything measured with the real glyphs is in place before transitions come back.
      void document.body.offsetHeight;
    } finally {
      delete document.documentElement.dataset.boot;
    }
  }
  window.__show__ = showPage;

  // The page is its own first frame: the shell, the planned periods, the remembered
  // quota shape and the usage boards render before the first snapshot is read.
  (function boot() {
    var picker = document.querySelector('[data-filter="deepseek"]');
    if (picker) picker.hidden = beadProviders().indexOf("deepseek") < 0;
    bootPeriodSeg();
    bootCurrency();
    bootQuota();
    beadStart();
    syncSegs();
    var faces = document.fonts && typeof document.fonts.load === "function"
      ? Promise.all(['12px "Ark Pixel 12px"', '12px "Fusion Pixel 12px"'].map(function (font) { return document.fonts.load(font); }))
      : Promise.resolve();
    // Fonts slower than the head script's cap land on a page already showing: the pill and the
    // remembered boxes are measured again with the real glyphs.
    function arrived() {
      fontsIn = true;
      if (pageShown) { syncSegs(); if (!data) holdQuotaBoxes(); }
      else if (firstRead) showPage();
    }
    faces.then(arrived, arrived);
  })();
  load();
})();
</script>
</body>
</html>
