<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#f3f5f7">
<link rel="icon" href="data:,">
<title>AI Usage</title>
<style>
  :root {
    --canvas: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #e9edf1;
    --ink: #15191d;
    --ink-2: #4b545d;
    --muted: #747f89;
    --line: #d7dde2;
    --line-strong: #bcc5cd;
    --claude: #d96c43;
    --claude-soft: #f7e6df;
    --codex: #3973f4;
    --codex-soft: #e4ecff;
    --cache: #158b78;
    --input: #65717c;
    --output: #b43c67;
    --warning: #b97913;
    --shadow: 0 1px 2px rgba(21, 25, 29, .06), 0 8px 24px rgba(21, 25, 29, .05);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --canvas: #111416;
      --surface: #191d20;
      --surface-2: #252b30;
      --ink: #f4f6f7;
      --ink-2: #c2c9cf;
      --muted: #929da6;
      --line: #30373d;
      --line-strong: #48525a;
      --claude: #e47f58;
      --claude-soft: #38251f;
      --codex: #6b96ff;
      --codex-soft: #202d4d;
      --cache: #39af99;
      --input: #9ba5ad;
      --output: #df6a92;
      --warning: #e0aa4c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .24), 0 10px 28px rgba(0, 0, 0, .22);
    }
  }

  :root[data-theme="dark"] {
    --canvas: #111416;
    --surface: #191d20;
    --surface-2: #252b30;
    --ink: #f4f6f7;
    --ink-2: #c2c9cf;
    --muted: #929da6;
    --line: #30373d;
    --line-strong: #48525a;
    --claude: #e47f58;
    --claude-soft: #38251f;
    --codex: #6b96ff;
    --codex-soft: #202d4d;
    --cache: #39af99;
    --input: #9ba5ad;
    --output: #df6a92;
    --warning: #e0aa4c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .24), 0 10px 28px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; letter-spacing: 0; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: color-mix(in srgb, var(--codex) 16%, transparent); }
  button:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--codex) 45%, transparent); outline-offset: 2px; }
  .mono, .number { font-family: "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .shell { max-width: 1240px; margin: 0 auto; padding: 22px 24px 56px; }
  .toolbar { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .mark { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 7px; background: var(--ink); color: var(--canvas); font: 700 16px/1 "Cascadia Code", monospace; }
  h1, h2 { text-wrap: balance; scroll-margin-top: 16px; }
  h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; }
  .stamp { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .segmented { display: inline-grid; grid-template-columns: repeat(3, minmax(62px, 1fr)); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
  .segmented button { min-height: 30px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; padding: 4px 11px; }
  .segmented button:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(21, 25, 29, .12); font-weight: 650; }
  .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
  .icon-button:hover { border-color: var(--line-strong); color: var(--ink); }

  .notice { margin: 14px 0 0; min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--ink-2); font-size: 12px; }
  .notice strong { color: var(--warning); font-weight: 650; }
  .local-state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .local-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cache); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cache) 14%, transparent); }

  .usage-rail { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .provider { position: relative; padding: 18px 20px 17px; min-width: 0; }
  .provider + .provider { border-left: 1px solid var(--line); }
  .provider::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--provider); }
  .provider-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .provider-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .provider-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--provider); }
  .provider-period { color: var(--muted); font-size: 11px; }
  .provider-cost { margin-top: 13px; font: 700 25px/1.1 "Cascadia Code", Consolas, monospace; }
  .provider-cost small { color: var(--muted); font: 400 11px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .provider-stats { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .provider-stat span { display: block; color: var(--muted); font-size: 11px; }
  .provider-stat b { display: block; margin-top: 2px; font: 600 12px/1.4 "Cascadia Code", Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .token-rail { height: 7px; margin-top: 16px; display: flex; overflow: hidden; border-radius: 3px; background: var(--surface-2); }
  .token-rail span { display: block; min-width: 0; }
  .rail-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; color: var(--muted); font-size: 10px; }
  .rail-legend i { width: 6px; height: 6px; display: inline-block; border-radius: 2px; margin-right: 4px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .kpi { min-height: 104px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
  .kpi-label { color: var(--muted); font-size: 11px; }
  .kpi-value { margin-top: 10px; font: 700 22px/1.05 "Cascadia Code", Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-note { margin-top: 8px; color: var(--ink-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .workspace { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, .8fr); gap: 28px; margin-top: 30px; }
  .section { min-width: 0; border-top: 1px solid var(--line-strong); padding-top: 15px; margin-top: 26px; }
  .workspace .section:first-child, .side .section:first-child { margin-top: 0; }
  .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .section h2 { margin: 0; font-size: 14px; line-height: 1.3; }
  .section-caption { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
  .section-total { color: var(--muted); font: 500 11px/1.4 "Cascadia Code", Consolas, monospace; white-space: nowrap; }
  .chart-wrap { height: 244px; width: 100%; }
  .chart { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid-line { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .axis-label { fill: var(--muted); font: 10px "Cascadia Code", Consolas, monospace; }
  .bar { transition: opacity .12s ease; }
  .bar:hover { opacity: .72; }

  .model-list { display: grid; gap: 12px; }
  .model-row { display: grid; grid-template-columns: minmax(110px, 1.2fr) minmax(100px, 2fr) 82px; align-items: center; gap: 10px; min-height: 30px; }
  .model-name { min-width: 0; }
  .model-name b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-name span { color: var(--muted); font-size: 10px; }
  .model-track { height: 8px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .model-fill { height: 100%; background: var(--provider); border-radius: 3px; }
  .model-value { text-align: right; font: 600 11px "Cascadia Code", Consolas, monospace; }

  .limit-list { display: grid; gap: 9px; }
  .limit-row { padding: 11px 12px; border-left: 3px solid var(--provider); background: color-mix(in srgb, var(--provider) 7%, var(--surface)); }
  .limit-row b { display: block; font-size: 12px; }
  .limit-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .empty { min-height: 86px; display: grid; place-items: center; border: 1px dashed var(--line-strong); border-radius: 7px; color: var(--muted); font-size: 12px; text-align: center; padding: 18px; }

  .table-section { margin-top: 30px; }
  details { border-top: 1px solid var(--line); }
  details:last-child { border-bottom: 1px solid var(--line); }
  summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; font-weight: 650; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--muted); font: 500 18px/1 "Cascadia Code", monospace; }
  details[open] summary::after { content: "−"; }
  .count { margin-left: 6px; color: var(--muted); font: 500 10px/1 "Cascadia Code", monospace; }
  .table-scroll { overflow-x: auto; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-size: 10px; font-weight: 650; background: var(--surface-2); }
  tbody tr:hover { background: color-mix(in srgb, var(--codex) 4%, var(--surface)); }
  .provider-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
  .provider-tag::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--provider); }
  .path { max-width: 340px; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  footer { margin-top: 28px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  #tooltip { position: fixed; z-index: 20; pointer-events: none; opacity: 0; padding: 7px 9px; border-radius: 5px; background: var(--ink); color: var(--canvas); box-shadow: var(--shadow); font-size: 11px; line-height: 1.5; transition: opacity .1s ease; }
  #loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--canvas); transition: opacity .28s ease; }
  #loader.done { opacity: 0; pointer-events: none; }
  .loader-box { width: min(360px, calc(100vw - 40px)); }
  .loader-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .loader-line { height: 3px; margin-top: 18px; background: var(--surface-2); overflow: hidden; }
  .loader-line::after { content: ""; display: block; width: 34%; height: 100%; background: var(--codex); animation: load 1.2s ease-in-out infinite; }
  .loader-message { margin-top: 12px; color: var(--muted); font-size: 12px; }
  #app { opacity: 0; transition: opacity .28s ease; }
  #app.show { opacity: 1; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 660px) {
    .shell { padding: 16px 14px 40px; }
    .toolbar { align-items: flex-start; }
    .actions { flex-direction: column-reverse; align-items: flex-end; }
    .usage-rail { grid-template-columns: 1fr; }
    .provider + .provider { border-left: 0; border-top: 1px solid var(--line); }
    .kpis { grid-template-columns: 1fr 1fr; }
    .kpi { min-height: 96px; }
    .kpi-value { font-size: 18px; }
    .notice { align-items: flex-start; flex-direction: column; gap: 5px; }
    .model-row { grid-template-columns: minmax(100px, 1fr) 1.4fr 70px; }
  }
  @media (max-width: 420px) {
    .toolbar { flex-direction: column; }
    .actions { width: 100%; flex-direction: row; align-items: center; }
    .segmented { flex: 1; }
    .kpis { grid-template-columns: 1fr; }
    .provider-stats { gap: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  .skip-link { position: fixed; left: 12px; top: 10px; z-index: 80; transform: translateY(-160%); background: var(--ink); color: var(--canvas); padding: 8px 12px; border-radius: 5px; text-decoration: none; }
  .skip-link:focus { transform: translateY(0); }
</style>
</head>
<body>
<a class="skip-link" href="#app">跳到主要内容</a>
<div id="loader" role="status" aria-live="polite">
  <div class="loader-box">
    <div class="loader-title"><span class="mark" aria-hidden="true">U</span><span>正在生成 AI Usage…</span></div>
    <div class="loader-line"></div>
    <div class="loader-message" id="loaderMessage">读取 Claude 与 Codex 本地会话记录</div>
  </div>
</div>

<main class="shell" id="app">
  <header class="toolbar">
    <div class="identity">
      <div class="mark" aria-hidden="true">U</div>
      <div>
        <h1>AI Usage</h1>
        <div class="stamp" id="stamp">等待数据</div>
      </div>
    </div>
    <div class="actions">
      <div class="segmented" aria-label="提供商筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="claude" aria-pressed="false" translate="no">Claude</button>
        <button type="button" data-filter="codex" aria-pressed="false" translate="no">Codex</button>
      </div>
      <button type="button" class="icon-button" id="themeButton" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
    </div>
  </header>

  <div class="notice">
    <span><strong>金额为 API 参考价估算</strong>，不等于订阅套餐、自定义服务商或实际账单。</span>
    <span class="local-state">仅处理本地会话元数据</span>
  </div>

  <section class="usage-rail" id="usageRail" aria-label="Claude 与 Codex 用量总览"></section>
  <section class="kpis" id="kpis" aria-label="筛选后的关键指标"></section>

  <div class="workspace">
    <div class="main-column">
      <section class="section">
        <div class="section-head">
          <div><h2>每日参考成本</h2><p class="section-caption">最近 30 天，按提供商叠加</p></div>
          <span class="section-total" id="trendTotal"></span>
        </div>
        <div class="chart-wrap" id="dailyChart"></div>
      </section>
      <section class="section">
        <div class="section-head">
          <div><h2>项目用量排行</h2><p class="section-caption">按 API 参考成本排序，不读取提示词内容</p></div>
          <span class="section-total" id="projectTotal"></span>
        </div>
        <div id="projectPreview"></div>
      </section>
    </div>
    <aside class="side">
      <section class="section">
        <div class="section-head">
          <div><h2>模型构成</h2><p class="section-caption">当前筛选范围</p></div>
        </div>
        <div class="model-list" id="modelList"></div>
      </section>
      <section class="section">
        <div class="section-head">
          <div><h2>当前窗口与限额</h2><p class="section-caption">只显示本地可读取的状态</p></div>
        </div>
        <div class="limit-list" id="limitList"></div>
      </section>
    </aside>
  </div>

  <section class="table-section" id="details"></section>
  <footer><span id="source"></span><span id="location"></span></footer>
</main>
<div id="tooltip"></div>

<script>
(function () {
  "use strict";
  var currentFilter = "all";
  var data = null;
  var loaderMessages = [
    "读取 Claude 与 Codex 本地会话记录…",
    "统一模型名称与公开 API 参考价…",
    "汇总项目、会话与缓存命中率…",
    "生成一次性本地快照…"
  ];
  var messageIndex = 0;
  var messageTimer = setInterval(function () {
    messageIndex = (messageIndex + 1) % loaderMessages.length;
    document.getElementById("loaderMessage").textContent = loaderMessages[messageIndex];
  }, 1700);

  function n(value) { return Number(value) || 0; }
  function sum(values) { return values.reduce(function (total, value) { return total + n(value); }, 0); }
  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>\"]/g, function (character) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[character];
    });
  }
  function integer(value) { return n(value).toLocaleString("zh-CN", { maximumFractionDigits: 0 }); }
  function compact(value) {
    value = n(value);
    if (value >= 1e9) return (value / 1e9).toFixed(value >= 1e10 ? 1 : 2) + "B";
    if (value >= 1e6) return (value / 1e6).toFixed(value >= 1e7 ? 1 : 2) + "M";
    if (value >= 1e3) return (value / 1e3).toFixed(value >= 1e4 ? 1 : 2) + "K";
    return integer(value);
  }
  function usd(value) {
    value = n(value);
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: value < 100 ? 2 : 0, maximumFractionDigits: value < 100 ? 2 : 0 }).format(value);
  }
  function dateTime(value) {
    var parsed = new Date(value);
    if (Number.isNaN(parsed.getTime())) return String(value || "-");
    return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(parsed);
  }
  function providerName(provider) { return provider === "claude" ? "Claude" : "Codex"; }
  function providerColor(provider) { return provider === "claude" ? "var(--claude)" : "var(--codex)"; }
  function reports() {
    if (currentFilter === "all") return ["claude", "codex"];
    return [currentFilter];
  }
  function report(provider) { return data.providers && data.providers[provider] ? data.providers[provider] : {}; }
  function overview(provider) { return report(provider).overview || { tokens: {} }; }
  function totalTokens(tokens) { tokens = tokens || {}; return n(tokens.input) + n(tokens.output) + n(tokens.cacheRead) + n(tokens.cacheWrite); }

  function renderProviderRail() {
    document.getElementById("usageRail").innerHTML = ["claude", "codex"].map(function (provider) {
      var item = overview(provider);
      var tokens = item.tokens || {};
      var total = totalTokens(tokens) || 1;
      var parts = [
        { label: "输入", value: n(tokens.input), color: "var(--input)" },
        { label: "输出", value: n(tokens.output), color: "var(--output)" },
        { label: "缓存读", value: n(tokens.cacheRead), color: "var(--cache)" },
        { label: "缓存写", value: n(tokens.cacheWrite), color: "var(--warning)" }
      ];
      return '<article class="provider" style="--provider:' + providerColor(provider) + '">' +
        '<div class="provider-head"><div class="provider-name"><span class="provider-dot"></span>' + providerName(provider) + '</div><span class="provider-period">最近 30 天</span></div>' +
        '<div class="provider-cost">' + usd(item.netCost != null ? item.netCost : item.cost) + ' <small>API 参考价</small></div>' +
        '<div class="provider-stats"><div class="provider-stat"><span>调用</span><b>' + integer(item.calls) + '</b></div><div class="provider-stat"><span>会话</span><b>' + integer(item.sessions) + '</b></div><div class="provider-stat"><span>缓存命中</span><b>' + n(item.cacheHitPercent).toFixed(1) + '%</b></div></div>' +
        '<div class="token-rail">' + parts.map(function (part) { return '<span style="width:' + (part.value / total * 100).toFixed(3) + '%;background:' + part.color + '"></span>'; }).join("") + '</div>' +
        '<div class="rail-legend">' + parts.map(function (part) { return '<span><i style="background:' + part.color + '"></i>' + part.label + ' ' + compact(part.value) + '</span>'; }).join("") + '</div>' +
      '</article>';
    }).join("");
  }

  function renderKpis() {
    var selected = reports();
    var cost = sum(selected.map(function (provider) { var item = overview(provider); return item.netCost != null ? item.netCost : item.cost; }));
    var calls = sum(selected.map(function (provider) { return overview(provider).calls; }));
    var sessions = sum(selected.map(function (provider) { return overview(provider).sessions; }));
    var tokens = sum(selected.map(function (provider) { return totalTokens(overview(provider).tokens); }));
    var cacheRead = sum(selected.map(function (provider) { return n((overview(provider).tokens || {}).cacheRead); }));
    var output = sum(selected.map(function (provider) { return n((overview(provider).tokens || {}).output); }));
    var items = [
      ["API 参考成本", usd(cost), currentFilter === "all" ? "Claude + Codex" : providerName(currentFilter)],
      ["调用次数", integer(calls), "最近 30 天"],
      ["会话数", integer(sessions), "本地记录"],
      ["处理 Tokens", compact(tokens), "输出 " + compact(output) + " · 缓存读 " + compact(cacheRead)]
    ];
    document.getElementById("kpis").innerHTML = items.map(function (item) {
      return '<article class="kpi"><div class="kpi-label">' + item[0] + '</div><div class="kpi-value">' + item[1] + '</div><div class="kpi-note">' + item[2] + '</div></article>';
    }).join("");
  }

  function dailyData() {
    var map = {};
    ["claude", "codex"].forEach(function (provider) {
      (report(provider).daily || []).forEach(function (item) {
        if (!map[item.date]) map[item.date] = { date: item.date, claude: 0, codex: 0 };
        map[item.date][provider] = n(item.cost);
      });
    });
    return Object.keys(map).sort().map(function (key) { return map[key]; }).slice(-30);
  }

  function renderChart() {
    var rows = dailyData();
    var host = document.getElementById("dailyChart");
    if (!rows.length) { host.innerHTML = '<div class="empty">暂无每日数据</div>'; return; }
    var width = 720, height = 244, left = 12, right = 12, top = 14, bottom = 28;
    var plotWidth = width - left - right, plotHeight = height - top - bottom;
    var totals = rows.map(function (row) {
      if (currentFilter === "all") return row.claude + row.codex;
      return row[currentFilter];
    });
    var maximum = Math.max.apply(Math, totals.concat([1]));
    var step = plotWidth / rows.length, barWidth = Math.max(3, Math.min(18, step * .62));
    var svg = '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="最近三十天每日 API 参考成本">';
    [0, .5, 1].forEach(function (ratio) {
      var y = top + plotHeight - plotHeight * ratio;
      svg += '<line class="grid-line" x1="' + left + '" y1="' + y + '" x2="' + (width - right) + '" y2="' + y + '"></line>';
      svg += '<text class="axis-label" x="' + (width - right) + '" y="' + (y - 4) + '" text-anchor="end">' + usd(maximum * ratio) + '</text>';
    });
    rows.forEach(function (row, index) {
      var x = left + index * step + (step - barWidth) / 2;
      var baseY = top + plotHeight;
      var providers = currentFilter === "all" ? ["claude", "codex"] : [currentFilter];
      providers.forEach(function (provider) {
        var value = row[provider], barHeight = value / maximum * plotHeight;
        baseY -= barHeight;
        svg += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + baseY.toFixed(1) + '" width="' + barWidth.toFixed(1) + '" height="' + Math.max(0, barHeight).toFixed(1) + '" rx="2" fill="' + providerColor(provider) + '" data-date="' + row.date + '" data-provider="' + provider + '" data-value="' + value + '"></rect>';
      });
      if (index % Math.ceil(rows.length / 7) === 0 || index === rows.length - 1) {
        svg += '<text class="axis-label" x="' + (x + barWidth / 2).toFixed(1) + '" y="' + (height - 8) + '" text-anchor="middle">' + row.date.slice(5) + '</text>';
      }
    });
    svg += '</svg>';
    host.innerHTML = svg;
    document.getElementById("trendTotal").textContent = usd(sum(totals));
    var tooltip = document.getElementById("tooltip");
    host.querySelectorAll(".bar").forEach(function (bar) {
      bar.addEventListener("mouseenter", function () {
        tooltip.innerHTML = escapeHtml(bar.dataset.date) + '<br>' + providerName(bar.dataset.provider) + ' · ' + usd(bar.dataset.value);
        tooltip.style.opacity = "1";
      });
      bar.addEventListener("mousemove", function (event) { tooltip.style.left = (event.clientX + 12) + "px"; tooltip.style.top = (event.clientY - 12) + "px"; });
      bar.addEventListener("mouseleave", function () { tooltip.style.opacity = "0"; });
    });
  }

  function modelData() {
    var result = [];
    reports().forEach(function (provider) {
      (report(provider).models || []).forEach(function (model) { result.push({ provider: provider, model: model }); });
    });
    return result.sort(function (a, b) { return n(b.model.cost) - n(a.model.cost); });
  }

  function renderModels() {
    var models = modelData();
    var host = document.getElementById("modelList");
    if (!models.length) { host.innerHTML = '<div class="empty">暂无模型数据</div>'; return; }
    var maximum = Math.max.apply(Math, models.map(function (item) { return n(item.model.cost); }).concat([1]));
    host.innerHTML = models.slice(0, 8).map(function (item) {
      return '<div class="model-row" style="--provider:' + providerColor(item.provider) + '"><div class="model-name"><b>' + escapeHtml(item.model.name) + '</b><span>' + providerName(item.provider) + ' · ' + integer(item.model.calls) + ' 次</span></div><div class="model-track"><div class="model-fill" style="width:' + (n(item.model.cost) / maximum * 100).toFixed(1) + '%"></div></div><div class="model-value">' + usd(item.model.cost) + '</div></div>';
    }).join("");
  }

  function projectData() {
    var result = [];
    reports().forEach(function (provider) {
      (report(provider).projects || []).forEach(function (project) { result.push({ provider: provider, project: project }); });
    });
    return result.sort(function (a, b) { return n(b.project.cost) - n(a.project.cost); });
  }

  function renderProjectPreview() {
    var projects = projectData();
    document.getElementById("projectTotal").textContent = projects.length + " 个项目记录";
    if (!projects.length) { document.getElementById("projectPreview").innerHTML = '<div class="empty">暂无项目数据</div>'; return; }
    var maximum = Math.max.apply(Math, projects.map(function (item) { return n(item.project.cost); }).concat([1]));
    document.getElementById("projectPreview").innerHTML = '<div class="model-list">' + projects.slice(0, 6).map(function (item) {
      var name = item.project.name || item.project.path || "未命名项目";
      return '<div class="model-row" style="--provider:' + providerColor(item.provider) + '"><div class="model-name"><b title="' + escapeHtml(item.project.path || name) + '">' + escapeHtml(name) + '</b><span>' + providerName(item.provider) + ' · ' + integer(item.project.sessions) + ' 会话</span></div><div class="model-track"><div class="model-fill" style="width:' + (n(item.project.cost) / maximum * 100).toFixed(1) + '%"></div></div><div class="model-value">' + usd(item.project.cost) + '</div></div>';
    }).join("") + '</div>';
  }

  function renderLimits() {
    var html = [];
    var blocks = data.limits && data.limits.claudeBlocks && data.limits.claudeBlocks.blocks ? data.limits.claudeBlocks.blocks : [];
    var active = blocks.filter(function (block) { return block.isActive && !block.isGap; })[0];
    if ((currentFilter === "all" || currentFilter === "claude") && active) {
      var end = active.endTime ? " · 预计结束 " + dateTime(active.endTime) : "";
      html.push('<div class="limit-row" style="--provider:var(--claude)"><b>Claude 当前 5 小时窗口</b><span>' + compact(active.totalTokens) + ' tokens · ' + usd(active.costUSD) + end + '</span></div>');
    }
    if (currentFilter === "all" || currentFilter === "codex") {
      var codex = data.limits && data.limits.codex;
      var primary = codex && codex.primary;
      if (primary && primary.used_percent != null) {
        html.push('<div class="limit-row" style="--provider:var(--codex)"><b>Codex 当前限额</b><span>已使用 ' + n(primary.used_percent).toFixed(1) + '%</span></div>');
      } else {
        html.push('<div class="limit-row" style="--provider:var(--codex)"><b>Codex 限额状态</b><span>当前服务商未返回可显示的限额数据</span></div>');
      }
    }
    if (!html.length) html.push('<div class="empty">当前没有活动窗口数据</div>');
    document.getElementById("limitList").innerHTML = html.join("");
  }

  function table(headers, rows) {
    return '<div class="table-scroll"><table><thead><tr>' + headers.map(function (header) { return '<th>' + header + '</th>'; }).join("") + '</tr></thead><tbody>' + rows.join("") + '</tbody></table></div>';
  }
  function details(title, count, content, open) {
    return '<details' + (open ? ' open' : '') + '><summary>' + title + '<span class="count">' + count + '</span></summary>' + content + '</details>';
  }

  function renderDetails() {
    var projects = projectData();
    var projectRows = projects.map(function (item) {
      var project = item.project;
      return '<tr><td class="path" title="' + escapeHtml(project.path || "") + '">' + escapeHtml(project.name || project.path || "未命名项目") + '</td><td><span class="provider-tag" style="--provider:' + providerColor(item.provider) + '">' + providerName(item.provider) + '</span></td><td class="number">' + integer(project.sessions) + '</td><td class="number">' + integer(project.calls) + '</td><td class="number">' + usd(project.cost) + '</td></tr>';
    });
    var sessions = [];
    reports().forEach(function (provider) {
      (report(provider).topSessions || []).forEach(function (session) { sessions.push({ provider: provider, session: session }); });
    });
    sessions.sort(function (a, b) { return n(b.session.cost) - n(a.session.cost); });
    var sessionRows = sessions.slice(0, 40).map(function (item) {
      return '<tr><td class="mono">' + escapeHtml(String(item.session.sessionId || "").slice(0, 13)) + '</td><td><span class="provider-tag" style="--provider:' + providerColor(item.provider) + '">' + providerName(item.provider) + '</span></td><td>' + escapeHtml(item.session.date || "-") + '</td><td class="path">' + escapeHtml(item.session.project || "-") + '</td><td class="number">' + integer(item.session.calls) + '</td><td class="number">' + usd(item.session.cost) + '</td></tr>';
    });
    var models = modelData();
    var modelRows = models.map(function (item) {
      var model = item.model;
      var tokens = n(model.inputTokens) + n(model.outputTokens) + n(model.cacheReadTokens) + n(model.cacheWriteTokens);
      return '<tr><td>' + escapeHtml(model.name) + '</td><td><span class="provider-tag" style="--provider:' + providerColor(item.provider) + '">' + providerName(item.provider) + '</span></td><td class="number">' + integer(model.calls) + '</td><td class="number">' + compact(tokens) + '</td><td class="number">' + usd(model.cost) + '</td></tr>';
    });
    document.getElementById("details").innerHTML =
      details("项目明细", projects.length, table(["项目", "提供商", "会话", "调用", "参考成本"], projectRows), window.innerWidth > 660) +
      details("高用量会话", sessions.length, table(["会话", "提供商", "日期", "项目", "调用", "参考成本"], sessionRows), false) +
      details("模型明细", models.length, table(["模型", "提供商", "调用", "Tokens", "参考成本"], modelRows), false);
  }

  function render() {
    renderProviderRail();
    renderKpis();
    renderChart();
    renderModels();
    renderProjectPreview();
    renderLimits();
    renderDetails();
  }

  function setupTheme() {
    var root = document.documentElement;
    var key = "ai-usage-ledger-theme";
    var themeColor = document.getElementById("themeColor");
    function syncThemeColor() {
      var current = root.getAttribute("data-theme");
      var darkBySystem = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      themeColor.setAttribute("content", current === "dark" || (current === "auto" && darkBySystem) ? "#111416" : "#f3f5f7");
    }
    try { var saved = localStorage.getItem(key); if (saved) root.setAttribute("data-theme", saved); } catch (error) {}
    syncThemeColor();
    document.getElementById("themeButton").addEventListener("click", function () {
      var current = root.getAttribute("data-theme");
      var darkBySystem = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = current === "dark" || (current === "auto" && darkBySystem);
      var next = isDark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      syncThemeColor();
      try { localStorage.setItem(key, next); } catch (error) {}
    });
  }

  var requestedFilter = new URLSearchParams(location.search).get("provider");
  if (["all", "claude", "codex"].indexOf(requestedFilter) >= 0) currentFilter = requestedFilter;
  document.querySelectorAll("[data-filter]").forEach(function (button) {
    button.setAttribute("aria-pressed", button.dataset.filter === currentFilter ? "true" : "false");
    button.addEventListener("click", function () {
      currentFilter = button.dataset.filter;
      var url = new URL(location.href);
      if (currentFilter === "all") url.searchParams.delete("provider"); else url.searchParams.set("provider", currentFilter);
      history.replaceState(null, "", url);
      document.querySelectorAll("[data-filter]").forEach(function (item) { item.setAttribute("aria-pressed", item === button ? "true" : "false"); });
      render();
    });
  });
  setupTheme();

  window.__render__ = function () {
    data = window.__DATA__ || {};
    document.getElementById("stamp").textContent = "生成于 " + dateTime(data.generatedAt) + " · " + (data.period === "30days" ? "最近 30 天" : data.period || "本地快照");
    document.getElementById("source").textContent = (data.source && data.source.name ? data.source.name : "本地统计") + (data.source && data.source.version ? " " + data.source.version : "");
    document.getElementById("location").textContent = data.appDir || "";
    render();
    clearInterval(messageTimer);
    document.getElementById("app").classList.add("show");
    var loader = document.getElementById("loader");
    loader.classList.add("done");
    setTimeout(function () { loader.style.display = "none"; }, 320);
  };

  var attempts = 0;
  function loadData() {
    var script = document.createElement("script");
    script.src = "data.js?t=" + Date.now();
    script.onload = function () { script.remove(); };
    script.onerror = function () {
      script.remove();
      attempts += 1;
      if (attempts < 300) setTimeout(loadData, 500);
      else document.getElementById("loaderMessage").textContent = "数据生成超时，请重新启动";
    };
    document.body.appendChild(script);
  }
  loadData();
})();
</script>
</body>
</html>
